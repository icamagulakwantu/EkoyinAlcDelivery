<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ekoyini — Shop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .cat-section { margin-bottom: 24px; }
    .cat-section-header {
      display: flex; align-items: center; gap: 8px;
      padding: 16px 16px 10px;
      border-top: 1px solid var(--border);
    }
    .cat-section-header h2 {
      font-family: var(--font-display);
      font-size: 16px; color: var(--white); flex: 1;
    }
    .cat-section-header .cat-count {
      font-size: 10px; color: var(--muted);
      background: var(--card); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 10px;
    }
    .retry-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .retry-state button { margin-top: 12px; background: var(--terra-light); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 12px; font-weight: 700; }
    .shop-search { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 14px; margin: 10px 12px 4px; }
    .shop-search svg { color: var(--muted); flex-shrink: 0; }
    .shop-search input { flex: 1; background: transparent; border: none; color: var(--white); font-size: 13px; outline: none; }
    .shop-search input::placeholder { color: var(--faint); }
    .shop-search .search-clear { color: var(--muted); font-size: 16px; line-height: 1; padding: 4px; display: none; }
    .collection-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 12px 0; padding: 10px 14px; background: var(--green-glow); border-radius: var(--r-md); font-size: 12px; color: var(--green-light); font-weight: 600; }
    .collection-banner a { color: inherit; text-decoration: underline; font-weight: 700; white-space: nowrap; }
    .no-results { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 13px; }
    .sourcing-note { display: flex; align-items: center; gap: 6px; margin: 8px 12px 0; font-size: 11px; color: var(--muted); }
    .fav-btn { position: absolute; top: 8px; right: 8px; z-index: 1; background: rgba(255,255,255,0.85); border: none; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .fav-btn.active { color: var(--terra); }
    #favToggle { cursor: pointer; }
    #favToggle.active { background: var(--terra-light); color: #fff; border-color: var(--terra-light); }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="back-arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="logo">
      <div class="logo-text">Ekoyini</div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div id="navAuthSlot"></div>
      <a href="cart.html" class="nav-icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span class="badge" id="navCartCount">0</span>
      </a>
    </div>
  </nav>

  <!-- ADDRESS -->
  <div class="address-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
    </svg>
    <input type="text" id="shopAddress" placeholder="Enter delivery address">
    <button class="addr-save" onclick="saveAddress()">Save</button>
  </div>

  <!-- SEARCH -->
  <div class="shop-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="shopSearch" placeholder="Search by name, e.g. Savanna, Klipdrift…">
    <span class="search-clear" id="searchClear" onclick="clearSearch()">&times;</span>
  </div>
  <div class="sourcing-note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M3 9l1-5h16l1 5M3 9a2 2 0 0 0 4 0M7 9a2 2 0 0 0 4 0M11 9a2 2 0 0 0 4 0M15 9a2 2 0 0 0 4 0M4 9v10h16V9"/></svg>
    Sourced from verified local taverns in your township
  </div>
  <div class="pill-scroll" style="padding-top:8px;">
    <div class="pill-tag" id="favToggle" onclick="toggleFavoritesOnly()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12" style="vertical-align:-1px;margin-right:4px;"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>My Favorites
    </div>
  </div>
  <div class="collection-banner" id="collectionBanner" style="display:none;">
    <span id="collectionLabel"></span>
    <a href="shop.html">Show everything</a>
  </div>

  <!-- CATEGORY PILLS -->
  <div class="pill-scroll" id="catPills"></div>

  <!-- COOLER BOX BUILDER -->
  <div class="cooler-bar" id="coolerBar" style="display:none;">
    <div class="cooler-bar-top">
      <div class="cooler-bar-title">Cooler Box</div>
      <div class="cooler-bar-total" id="coolerTotal">R0.00</div>
    </div>
    <div class="cooler-progress-track"><div class="cooler-progress-fill" id="coolerFill" style="width:0%"></div></div>
    <div class="cooler-tier-labels">
      <span id="tier300">R300 · 5%</span>
      <span id="tier600">R600 · 10%</span>
      <span id="tier1000">R1000 · 15%</span>
    </div>
    <div class="cooler-slots" id="coolerSlots"></div>
  </div>

  <!-- PRODUCT SECTIONS -->
  <div class="page" id="shopPage" style="padding-top:8px"></div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="index.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="shop.html" class="bnav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Shop
    </a>
    <a href="cart.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Cart
      <span class="bnav-badge" id="bnavCartCount" style="display:none">0</span>
    </a>
    <a href="track.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Track
    </a>
    <a href="profile.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <!-- PRICE DETAILS SHEET (read-only) -->
  <div class="modal-overlay" id="priceModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h3 id="modalTitle">Price Details</h3>
      <div id="priceDetailsBody"></div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- TOASTS -->
  <div class="toast" id="toastEl"></div>
  <div class="toast-top" id="toastTopEl"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
  renderNavAuth();

  // Cooler Box eligibility — the target market's actual buying pattern
  // (dumpies, spirits, mixers, ice, water). Wine/champagne/cognac/brandy
  // stay purchasable in the regular grid but don't feed the Cooler Box.
  const COOLER_ELIGIBLE = new Set([
    'BEER', 'CIDER_RTD', 'WHISKY', 'GIN', 'VODKA', 'VODKA_PREMIUM',
    'TEQUILA', 'TEQUILA_PREMIUM', 'LIQUEUR', 'MIXER', 'WATER', 'ICE',
  ]);

  let cart = EkoyiniCart.get();
  let products = [];

  // Occasion collections — each links here as shop.html?cats=A,B,C so the
  // homepage's "Today's Deals" cards can deep-link to a pre-filtered view
  // instead of dumping everyone on the full 18-category catalog.
  const COLLECTIONS = {
    festive: { label: 'Festive Season Crate', cats: ['BEER', 'SPARKLING', 'CHAMPAGNE', 'WHISKY', 'MIXER', 'ICE'] },
    braai: { label: 'Weekend Braai Pack', cats: ['BEER', 'CIDER_RTD', 'MIXER', 'ICE'] },
    stokvel: { label: 'Stokvel & Party Case', cats: ['BRANDY', 'WHISKY', 'BEER', 'MIXER'] },
    chill: { label: 'Chill Session', cats: ['CIDER_RTD', 'WINE', 'SPARKLING'] },
  };

  const params = new URLSearchParams(window.location.search);
  let searchQuery = (params.get('q') || '').trim();
  let categoryFilter = null; // null = show every category
  let collectionLabel = null;
  if (params.get('cats')) {
    categoryFilter = new Set(params.get('cats').split(',').map((c) => c.trim()).filter(Boolean));
  } else if (params.get('collection') && COLLECTIONS[params.get('collection')]) {
    const c = COLLECTIONS[params.get('collection')];
    categoryFilter = new Set(c.cats);
    collectionLabel = c.label;
  }

  function fmtPrice(v) { return v == null ? 'POA' : 'R' + v.toFixed(2); }

  let showFavoritesOnly = false;

  function getFilteredProducts() {
    const q = searchQuery.toLowerCase();
    return products.filter((p) => {
      if (showFavoritesOnly && !EkoyiniFavorites.has(p.id)) return false;
      if (categoryFilter && !categoryFilter.has(p.category)) return false;
      if (q && !p.name.toLowerCase().includes(q) && !p.productType.toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function toggleFavoritesOnly() {
    showFavoritesOnly = !showFavoritesOnly;
    document.getElementById('favToggle').classList.toggle('active', showFavoritesOnly);
    buildCatalog();
  }

  function toggleFavorite(id, btn) {
    const justAdded = EkoyiniFavorites.toggle(id);
    btn.classList.toggle('active', justAdded);
    btn.querySelector('svg').setAttribute('fill', justAdded ? 'currentColor' : 'none');
    if (showFavoritesOnly && !justAdded) buildCatalog();
  }

  // Debounced — avoids rebuilding the whole grid on every keystroke.
  let searchDebounce;
  function applySearch() {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => {
      searchQuery = document.getElementById('shopSearch').value.trim();
      document.getElementById('searchClear').style.display = searchQuery ? 'block' : 'none';
      buildCatalog();
    }, 200);
  }

  function clearSearch() {
    document.getElementById('shopSearch').value = '';
    searchQuery = '';
    document.getElementById('searchClear').style.display = 'none';
    buildCatalog();
  }

  function renderSkeleton() {
    const page = document.getElementById('shopPage');
    const grid = document.createElement('div');
    grid.className = 'product-grid';
    for (let i = 0; i < 6; i++) {
      const s = document.createElement('div');
      s.className = 'skel-product-card';
      grid.appendChild(s);
    }
    page.innerHTML = '';
    page.appendChild(grid);
  }

  async function loadCatalog() {
    renderSkeleton();
    try {
      const res = await fetch('/api/products');
      if (!res.ok) throw new Error('Bad response');
      products = await res.json();
      buildCatalog();
      updateBadges();
      updateCoolerBox();
    } catch (err) {
      console.error('Failed to load catalog:', err);
      document.getElementById('shopPage').innerHTML = `
        <div class="retry-state">
          Failed to load products.
          <div><button onclick="loadCatalog()">Retry</button></div>
        </div>`;
    }
  }

  function buildCatalog() {
    const page = document.getElementById('shopPage');
    const pills = document.getElementById('catPills');
    page.innerHTML = '';
    pills.innerHTML = '';

    const banner = document.getElementById('collectionBanner');
    if (collectionLabel) {
      document.getElementById('collectionLabel').textContent = `Showing: ${collectionLabel}`;
      banner.style.display = 'flex';
    } else {
      banner.style.display = 'none';
    }

    const filtered = getFilteredProducts();
    const byCategory = {};
    filtered.forEach(p => {
      if (!byCategory[p.category]) byCategory[p.category] = [];
      byCategory[p.category].push(p);
    });

    if (filtered.length === 0) {
      const noResultsMsg = showFavoritesOnly
        ? 'No favorites yet — tap the heart on a product to save it here.'
        : `No products match${searchQuery ? ` "${searchQuery}"` : ' this filter'}.`;
      page.innerHTML = `<div class="no-results">${noResultsMsg} <a href="shop.html" style="color:var(--terra-light);">Show everything</a></div>`;
      return;
    }

    let first = true;
    Object.entries(byCategory).forEach(([cat, items]) => {
      const pill = document.createElement('div');
      pill.className = 'pill-tag' + (first ? ' active' : '');
      pill.textContent = cat.replace(/_/g, ' ');
      pill.onclick = () => {
        document.querySelectorAll('.pill-tag').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        document.getElementById('sec-' + cat)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      pills.appendChild(pill);

      const sec = document.createElement('div');
      sec.className = 'cat-section';
      sec.id = 'sec-' + cat;
      sec.innerHTML = `<div class="cat-section-header">
        <h2>${cat.replace(/_/g, ' ')}${COOLER_ELIGIBLE.has(cat) ? ' <span class="tag-terra" style="margin-left:6px;">Cooler Box</span>' : ''}</h2>
        <span class="cat-count">${items.length} items</span>
      </div>`;
      const grid = document.createElement('div');
      grid.className = 'product-grid';
      items.forEach(p => {
        const qty = cart[p.id] || 0;
        const card = document.createElement('div');
        card.className = 'product-card';
        card.id = 'card-' + p.id;
        const isFav = EkoyiniFavorites.has(p.id);
        card.innerHTML = `
          <button class="fav-btn${isFav ? ' active' : ''}" onclick="toggleFavorite('${p.id}', this)">
            <svg viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
          <div class="product-info">
            <h3>${p.name}</h3>
            <div class="product-size">${p.bottleFormat}</div>
            <div class="product-footer">
              <div class="product-price" onclick="showPriceDetails('${p.id}')">
                ${fmtPrice(p.retailSingleZAR)}
              </div>
              <div id="ctrl-${p.id}"></div>
            </div>
          </div>`;
        grid.appendChild(card);
        renderQtyControl(p.id);
      });
      sec.appendChild(grid);
      page.appendChild(sec);
      first = false;
    });
  }

  function renderQtyControl(id) {
    const holder = document.getElementById('ctrl-' + id);
    if (!holder) return;
    const qty = cart[id] || 0;
    if (qty > 0) {
      holder.innerHTML = `
        <div class="stepper-inline">
          <button onclick="changeQty('${id}', -1)">−</button>
          <span>${qty}</span>
          <button onclick="changeQty('${id}', 1)">+</button>
        </div>`;
    } else {
      holder.innerHTML = `<button class="add-btn" onclick="changeQty('${id}', 1)">+</button>`;
    }
  }

  function changeQty(id, delta) {
    const newQty = (cart[id] || 0) + delta;
    if (newQty <= 0) delete cart[id]; else cart[id] = newQty;
    EkoyiniCart.save(cart);
    renderQtyControl(id);
    updateBadges();
    updateCoolerBox();
    if (delta > 0) showToastTop('Added to cart');
  }

  function updateBadges() {
    const count = Object.values(cart).reduce((a, b) => a + b, 0);
    document.getElementById('navCartCount').textContent = count;
    const bn = document.getElementById('bnavCartCount');
    bn.textContent = count;
    bn.style.display = count > 0 ? 'flex' : 'none';
  }

  function updateCoolerBox() {
    const bar = document.getElementById('coolerBar');
    const eligibleEntries = Object.entries(cart).filter(([id]) => {
      const p = products.find(x => x.id === id);
      return p && COOLER_ELIGIBLE.has(p.category);
    });

    if (eligibleEntries.length === 0) { bar.style.display = 'none'; return; }
    bar.style.display = 'block';

    let subtotal = 0;
    eligibleEntries.forEach(([id, qty]) => {
      const p = products.find(x => x.id === id);
      subtotal += p.retailSingleZAR * qty;
    });

    document.getElementById('coolerTotal').textContent = fmtPrice(subtotal);
    const pct = Math.min(100, (subtotal / 1000) * 100);
    document.getElementById('coolerFill').style.width = pct + '%';
    document.getElementById('tier300').classList.toggle('hit', subtotal >= 300);
    document.getElementById('tier600').classList.toggle('hit', subtotal >= 600);
    document.getElementById('tier1000').classList.toggle('hit', subtotal >= 1000);

    const slots = document.getElementById('coolerSlots');
    slots.innerHTML = '';
    for (let i = 0; i < 8; i++) {
      const entry = eligibleEntries[i];
      const slot = document.createElement('div');
      slot.className = 'cooler-slot' + (entry ? ' filled' : '');
      if (entry) {
        const p = products.find(x => x.id === entry[0]);
        slot.title = `${p.name} × ${entry[1]}`;
      }
      slots.appendChild(slot);
    }
  }

  function showPriceDetails(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modalTitle').textContent = p.name;
    const perUnitCase = p.retailCaseZAR / p.unitsPerCase;
    document.getElementById('priceDetailsBody').innerHTML = `
      <div class="price-details-row"><span class="pd-label">Single bottle</span><span class="pd-value">${fmtPrice(p.retailSingleZAR)}</span></div>
      <div class="price-details-row"><span class="pd-label">Case (${p.unitsPerCase} units)</span><span class="pd-value">${fmtPrice(p.retailCaseZAR)}</span></div>
      <div class="price-details-row"><span class="pd-label">Per unit (case)</span><span class="pd-value">${fmtPrice(perUnitCase)}</span></div>
      <div class="price-details-row"><span class="pd-label">Case savings</span><span class="price-details-save">${p.retailCaseDiscountPct}% off</span></div>`;
    document.getElementById('priceModal').classList.add('open');
  }

  function closeModal() { document.getElementById('priceModal').classList.remove('open'); }

  function saveAddress() {
    const v = document.getElementById('shopAddress').value.trim();
    if (v) EkoyiniAddress.save(v);
  }

  // Live re-sync if the cart changes in another tab.
  window.addEventListener('ekoyini:cart-updated', () => {
    cart = EkoyiniCart.get();
    products.forEach(p => renderQtyControl(p.id));
    updateBadges();
    updateCoolerBox();
  });

  // Init
  const addr = EkoyiniAddress.get();
  if (addr) document.getElementById('shopAddress').value = addr;
  if (searchQuery) {
    document.getElementById('shopSearch').value = searchQuery;
    document.getElementById('searchClear').style.display = 'block';
  }
  document.getElementById('shopSearch').addEventListener('input', applySearch);
  if (requireAgeGate()) loadCatalog();
  </script>
</body>
</html>
