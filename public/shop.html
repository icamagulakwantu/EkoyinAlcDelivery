<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/favicon-180.png">
  <title>Shop drinks — Ekoyini</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#faf6ee">
  <link rel="stylesheet" href="style.css">
  <style>
    .cat-section { margin-bottom: 24px; }
    .cat-section-header {
      display: flex; align-items: center; gap: 8px;
      padding: 16px 16px 10px;
      border-top: 1px solid var(--border);
    }
    .cat-section-header h2 {
      font-family: var(--font-display);
      font-size: 16px; color: var(--white); flex: 1;
    }
    .cat-section-header .cat-count {
      font-size: 10px; color: var(--muted);
      background: var(--card); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 10px;
    }
    .retry-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .retry-state button { margin-top: 12px; background: var(--terra-light); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 12px; font-weight: 700; }
    .shop-search { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 14px; margin: 10px 12px 4px; }
    .shop-search svg { color: var(--muted); flex-shrink: 0; }
    .shop-search input { flex: 1; background: transparent; border: none; color: var(--white); font-size: 13px; outline: none; }
    .shop-search input::placeholder { color: var(--faint); }
    .shop-search .search-clear { color: var(--muted); font-size: 16px; line-height: 1; padding: 4px; display: none; }
    .collection-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 12px 0; padding: 10px 14px; background: var(--green-glow); border-radius: var(--r-md); font-size: 12px; color: var(--green-light); font-weight: 600; }
    .collection-banner a { color: inherit; text-decoration: underline; font-weight: 700; white-space: nowrap; }
    .no-results { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 13px; }
    .sourcing-note { display: flex; align-items: center; gap: 6px; margin: 8px 12px 0; font-size: 11px; color: var(--muted); }
    .fav-btn { position: absolute; top: 8px; right: 8px; z-index: 1; background: rgba(255,255,255,0.85); border: none; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .product-card.out-of-stock { opacity: 0.55; }
    .stock-badge { position: absolute; top: 8px; left: 8px; z-index: 1; background: var(--white); color: var(--surface); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 3px 7px; border-radius: 4px; }
    .add-btn-disabled { font-size: 10px; color: var(--muted); font-weight: 600; }
    .price-soon { font-size: 12px; font-weight: 700; color: var(--muted); cursor: default; }
    .fav-btn.active { color: var(--terra); }
    #favToggle { cursor: pointer; }
    #favToggle.active { background: var(--terra-light); color: #fff; border-color: var(--terra-light); }
    .brand-filter-pill { cursor: pointer; }
    .brand-filter-pill.active { background: var(--gold); border-color: var(--gold); color: #1a1400; }

    /* PRODUCT PHOTO BOX — every card gets the same fixed square, so photos of
       any shape sit in the same place. object-fit: contain scales a photo to
       fit INSIDE the box (never cropped, never stretched, never overflowing),
       and the padding keeps bottles off the edges. */
    .product-img-box {
      position: relative; width: 100%; aspect-ratio: 1 / 1; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 14px; overflow: hidden;
      background: var(--black); border-bottom: 1px solid var(--p-hairline, var(--border));
    }
    .product-img-box img {
      display: block; width: 100%; height: 100%;
      object-fit: contain; object-position: center;
    }
    .product-img-box .img-fallback {
      font-family: var(--font-display); font-size: 34px; font-weight: 700; color: var(--faint);
    }

    /* HERO AISLE BANNER — crossfade + slide between aisles as you tap a
       category pill, the same motion language as the onboarding carousel
       (see index.html's .ob-slide) so it feels like one consistent app,
       not a new pattern. Every slide sits stacked (position: absolute);
       switching aisle slides the new one in from the right while the old
       one exits left, instead of an abrupt swap. */
    .shop-hero { position: relative; height: 148px; margin: 10px 12px 4px; border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
    .shop-hero-slide {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 16px; background-size: cover; background-position: center;
      opacity: 0; transform: translateX(28px);
      transition: opacity 0.4s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    .shop-hero-slide::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.75) 100%);
    }
    .shop-hero-slide.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
    .shop-hero-slide.prev { transform: translateX(-28px); }
    .shop-hero-slide .sh-title { position: relative; font-family: var(--font-display); font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 3px; }
    .shop-hero-slide .sh-sub { position: relative; font-size: 11px; color: rgba(255,255,255,0.88); line-height: 1.4; max-width: 78%; }
    .shop-hero-dots { position: absolute; bottom: 10px; right: 14px; display: flex; gap: 5px; z-index: 1; }
    .shop-hero-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); transition: background 0.2s, width 0.2s; cursor: pointer; }
    .shop-hero-dot.active { background: #fff; width: 16px; border-radius: 3px; }

    /* Brand story badges — small chips in the card's text flow, only ever
       rendered for a SKU whose brandTags array actually has something in
       it (see schema.prisma's note on how strict that bar is). */
    .brand-badges { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 4px; }
    .tag-gold {
      display: inline-flex; align-items: center;
      background: rgba(255, 199, 0, 0.15); border: 1px solid rgba(122, 92, 0, 0.35);
      color: var(--gold-deep); font-size: 8px; font-weight: 700;
      padding: 2px 5px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.3px;
      white-space: nowrap;
    }
  </style>
    <link rel="stylesheet" href="premium.css">
  <link rel="stylesheet" href="app.css">
  <style id="shop-polish">
    /* SHOP POLISH (Nov 2026). Loaded after premium.css on purpose. Modelled on
       Uber Eats / Instacart / Gopuff: borderless product tiles, soft tinted photo
       stage, text under the tile, one dark round add button, floating cart bar. */
    body .product-grid { gap: 22px 14px !important; padding: 0 16px !important; }
    body .product-card { background: transparent !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; overflow: visible !important; }
    body .product-card:hover { transform: none !important; box-shadow: none !important; }
    body .product-card:active { transform: scale(0.985) !important; }
    /* Photo stage: soft warm gradient + multiply blending, so the white background
       baked into most packshots disappears instead of showing as a white square. */
    body .product-img-box { border: 0 !important; border-radius: 22px; padding: 6px; overflow: hidden;
      background: radial-gradient(120% 95% at 50% 28%, #ffffff 0%, #f9f3e6 52%, #efe6d1 100%);
      box-shadow: inset 0 0 0 1px rgba(23, 20, 14, 0.05); }
    body .product-img-box::after { content: ''; position: absolute; left: 24%; right: 24%; bottom: 9%; height: 7%; z-index: 0;
      background: radial-gradient(ellipse at center, rgba(23, 20, 14, 0.16), rgba(23, 20, 14, 0) 70%); pointer-events: none; }
    body .product-img-box img { position: relative; z-index: 1; mix-blend-mode: multiply; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
    body .product-card:hover .product-img-box img { transform: scale(1.04); }
    body .fav-btn { top: 10px; right: 10px; width: 32px; height: 32px; background: rgba(255,255,255,0.92); box-shadow: 0 1px 4px rgba(23,20,14,0.12); }
    body .stock-badge { top: 10px; left: 10px; border-radius: 999px; padding: 4px 9px; }
    body .product-info { padding: 10px 2px 0 !important; gap: 2px; }
    body .product-info h3 { font-size: 14px !important; font-weight: 600 !important; min-height: 2.6em; letter-spacing: -0.01em; }
    body .product-size { background: none !important; border: 0 !important; padding: 0 !important; font-size: 12px !important; font-weight: 500 !important; color: var(--muted) !important; letter-spacing: 0; }
    body .product-footer { padding-top: 8px !important; }
    body .product-price { font-size: 17px !important; font-weight: 700 !important; }
    body .add-btn { width: 38px !important; height: 38px !important; font-size: 22px !important; font-weight: 400 !important; line-height: 1;
      background: #17140e !important; color: #fff !important; box-shadow: 0 3px 10px rgba(23,20,14,0.22) !important; }
    body .add-btn:hover { background: #17140e !important; }
    body .stepper-inline { background: #17140e !important; border-radius: 999px !important; padding: 4px 6px !important; gap: 4px; box-shadow: 0 3px 10px rgba(23,20,14,0.22); }
    body .stepper-inline button { width: 28px !important; height: 28px !important; font-size: 18px !important; }
    body .stepper-inline span { font-size: 13px !important; min-width: 18px !important; }
    body .cat-section { margin-bottom: 8px; }
    body .cat-section-header { border-top: 0 !important; padding: 26px 16px 14px !important; }
    body .cat-section-header h2 { font-size: 24px !important; letter-spacing: -0.02em; }
    body .cat-section-header .cat-count { background: none !important; border: 0 !important; font-size: 12px !important; padding: 0 !important; }
    body .shop-search { border-radius: 999px !important; padding: 12px 18px !important; background: #fff; box-shadow: 0 1px 2px rgba(23,20,14,0.05), 0 6px 18px rgba(23,20,14,0.06); border-color: transparent !important; }
    body .shop-search input { font-size: 14px !important; }
    body .shop-hero { border-radius: 22px !important; }
    body #shopPage { padding-bottom: 150px !important; }
    /* Floating cart bar, shown once something is in the cart. */
    .cart-fab { position: fixed; z-index: 60; left: 16px; right: 16px;
      bottom: calc(var(--bottom-h, 64px) + 12px + env(safe-area-inset-bottom, 0px));
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      height: 54px; padding: 0 20px; border-radius: 999px; text-decoration: none;
      background: #17140e; color: #fff; font-weight: 700; font-size: 15px;
      box-shadow: 0 10px 30px rgba(23,20,14,0.35); animation: fab-in .28s cubic-bezier(.2,.8,.2,1); }
    .cart-fab[hidden] { display: none; }
    .cart-fab .cf-count { min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; background: #ff4500; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
    .cart-fab .cf-label { flex: 1; text-align: center; }
    .cart-fab .cf-total { font-variant-numeric: tabular-nums; }
    @keyframes fab-in { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (min-width: 700px) { .cart-fab { left: 50%; right: auto; width: 420px; transform: translateX(-50%); animation: none; } }
  </style>
  <style id="aisle-cards">
    /* Aisle cards (10 Nov 2026): rounded card, white plate bottom-right with
       real product photos, like the home deals. Sponsor-ready (see AISLES). */
    body .shop-hero { height: 196px; border-radius: 24px !important; background: #17140e; }
    .shop-hero-slide { padding: 18px 20px; justify-content: center; overflow: hidden; isolation: isolate; background: none; cursor: pointer; }
    .shop-hero-slide::before { display: none; }
    .shop-hero-slide.a-beer { background: radial-gradient(120% 140% at 100% 0%, #ffb21f 0%, #e07b00 45%, #8f3f00 100%); }
    .shop-hero-slide.a-spirits { background: radial-gradient(120% 140% at 100% 0%, #3a3127 0%, #1f1a13 55%, #120f0a 100%); }
    .shop-hero-slide.a-wine { background: radial-gradient(120% 140% at 100% 0%, #b0304f 0%, #7a1530 50%, #45091a 100%); }
    .shop-hero-slide.a-mixers { background: radial-gradient(120% 140% at 100% 0%, #2fa3c9 0%, #1a6f99 50%, #0e3f5c 100%); }
    .sh-copy { position: relative; z-index: 2; max-width: 52%; }
    .sh-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.82); }
    .shop-hero-slide .sh-title { font-size: 24px; line-height: 1.05; margin: 4px 0 4px; }
    .shop-hero-slide .sh-sub { max-width: none; font-size: 12px; }
    .sh-cta { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 8px 13px; border-radius: 999px; background: #fff; color: #17140e; font-weight: 800; font-size: 12.5px; }
    .sh-art { position: absolute; z-index: 1; right: -52px; bottom: -70px; width: 236px; height: 236px; border-radius: 50%; background: #fff; overflow: hidden;
      display: flex; align-items: flex-start; justify-content: center; padding: 30px 58px 0 32px; box-shadow: 0 18px 40px rgba(0,0,0,.28); }
    .sh-art img { height: 132px; width: auto; mix-blend-mode: multiply; }
    .sh-art img + img { height: 118px; margin-left: 4px; margin-top: 12px; }
    .sh-art img + img + img { height: 102px; margin-top: 26px; }
    body .shop-hero-dots { bottom: 12px; left: 20px; right: auto; }
    @media (min-width: 700px) { body .shop-hero { height: 220px; } .sh-art { width: 270px; height: 270px; right: -30px; } .sh-art img { height: 156px; } .sh-art img + img { height: 138px; } .sh-art img + img + img { height: 120px; } .sh-copy { max-width: 46%; } }
    /* Cooler Box card title was white on white since the light redesign. */
    body .cooler-bar-title { color: var(--white) !important; }
  </style>
  <style id="product-sheet">
    /* Product sheet (10 Nov 2026): tap a drink to see it big, with every pack
       of that drink side by side, like Sixty60 / Uber Eats. */
    .product-img-box, .product-info h3 { cursor: pointer; }
    .ps-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(23,20,14,.45); display: none; align-items: flex-end; justify-content: center; }
    .ps-overlay.open { display: flex; animation: ps-fade .2s ease; }
    .ps-sheet { position: relative; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--black); border-radius: 26px 26px 0 0; animation: ps-up .28s cubic-bezier(.2,.8,.2,1); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
    @media (min-width: 700px) { .ps-overlay { align-items: center; } .ps-sheet { border-radius: 26px; max-height: 88vh; } }
    @keyframes ps-up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
    @keyframes ps-fade { from { opacity: 0; } to { opacity: 1; } }
    .ps-close { position: absolute; top: 12px; right: 12px; z-index: 2; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); box-shadow: 0 2px 8px rgba(23,20,14,.15); font-size: 24px; line-height: 1; color: var(--white); cursor: pointer; }
    .ps-photo { aspect-ratio: 4 / 3; display: grid; place-items: center; background: radial-gradient(120% 95% at 50% 28%, #ffffff 0%, #f9f3e6 52%, #efe6d1 100%); border-radius: 26px 26px 0 0; }
    .ps-photo img { width: 78%; height: 88%; object-fit: contain; mix-blend-mode: multiply; }
    .ps-photo .img-fallback { font-family: var(--font-display); font-size: 64px; color: var(--faint); }
    .ps-body { padding: 18px 20px 8px; }
    .ps-cat { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .ps-name { font-family: var(--font-display); font-size: 26px; line-height: 1.1; margin-top: 4px; color: var(--white); }
    .ps-label { margin-top: 16px; font-size: 13px; font-weight: 800; color: var(--white); }
    .ps-packs { margin-top: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
    .ps-pack { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 10px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; font: inherit; color: var(--white); }
    .ps-pack.on { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
    .ps-pack[disabled] { opacity: .45; cursor: not-allowed; }
    .ps-pack b { font-size: 13px; }
    .ps-pack span { font-size: 12px; color: var(--muted); }
    .ps-pack strong { font-size: 15px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .ps-pack em { font-style: normal; font-size: 11px; font-weight: 800; color: var(--ok); }
    .ps-notes { margin-top: 14px; display: grid; gap: 8px; }
    .ps-note { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--muted); line-height: 1.45; padding: 10px 12px; border-radius: 14px; background: var(--deep); }
    .ps-note b { color: var(--white); }
    .ps-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 560px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--black) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--p-hairline, var(--border)); display: flex; gap: 10px; align-items: center; }
    @media (min-width: 700px) { .ps-bar { position: sticky; left: auto; transform: none; } }
    .ps-qty { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px; }
    .ps-qty button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--deep); font-size: 20px; font-weight: 700; color: var(--white); cursor: pointer; }
    .ps-qty b { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
    .ps-add { flex: 1; height: 50px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; cursor: pointer; }
    .ps-add[disabled] { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="back-arrow" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="logo">
      <img src="images/brand/ekoyini-icon.png" alt="Ekoyini">
      <div class="logo-text">Ekoyini</div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div id="navAuthSlot"></div>
      <a href="cart.html" class="nav-icon-btn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span class="badge" id="navCartCount">0</span>
      </a>
    </div>
  </nav>

  <!-- ADDRESS -->
  <div class="address-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
    </svg>
    <input type="text" id="shopAddress" placeholder="Enter delivery address" autocomplete="street-address" aria-label="Delivery address" onkeydown="if(event.key==='Enter')saveAddress()">
    <button type="button" class="addr-save" onclick="saveAddress()">Save</button>
  </div>


  <!-- HERO AISLE BANNER -->
  <div class="shop-hero" id="shopHero">
    <div class="shop-hero-dots" id="shopHeroDots"></div>
  </div>

  <div class="sourcing-note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M3 9l1-5h16l1 5M3 9a2 2 0 0 0 4 0M7 9a2 2 0 0 0 4 0M11 9a2 2 0 0 0 4 0M15 9a2 2 0 0 0 4 0M4 9v10h16V9"/></svg>
    Sourced from taverns, bottle stores &amp; liquor outlets — in your township and beyond, wherever the best price is
  </div>
  <div class="pill-scroll" style="padding-top:8px;">
    <button type="button" class="pill-tag" id="favToggle" aria-pressed="false" onclick="toggleFavoritesOnly()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12" style="vertical-align:-1px;margin-right:4px;"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>Favourites
    </button>
    <button type="button" class="pill-tag brand-filter-pill" data-tag="BLACK_OWNED" aria-pressed="false" onclick="toggleBrandFilter('BLACK_OWNED')">Black-owned</button>
    <button type="button" class="pill-tag brand-filter-pill" data-tag="WOMEN_OWNED" aria-pressed="false" onclick="toggleBrandFilter('WOMEN_OWNED')">Women-owned</button>
    <button type="button" class="pill-tag brand-filter-pill" data-tag="CELEBRITY_BACKED" aria-pressed="false" onclick="toggleBrandFilter('CELEBRITY_BACKED')">Celebrity-backed</button>
  </div>
  <div class="collection-banner" id="collectionBanner" style="display:none;">
    <span id="collectionLabel"></span>
    <a href="shop.html">Show everything</a>
  </div>

  <!-- STICKY SEARCH + CATEGORY PILLS (stays put while you scroll) -->
  <div class="shop-sticky" id="shopSticky">
    <form class="shop-search" role="search" onsubmit="event.preventDefault(); document.getElementById('shopSearch').blur();">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" aria-hidden="true">

  <!-- PRICE DETAILS SHEET (read-only) -->
  <div class="modal-overlay" id="priceModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="if(event.target===this)closeModal()">
    <div class="modal-sheet">
      <div class="modal-handle"></div>

      <div id="priceDetailsBody"></div>

        <button type="button" class="btn-cancel" onclick="closeModal()">Close</button>
      </div>

  <!-- PRODUCT SHEET: big photo + every pack of this drink side by side -->
  <div class="ps-overlay" id="productSheet" role="dialog" aria-modal="true" aria-labelledby="psName" onclick="if(event.target===this)closeProductSheet()">
    <div class="ps-sheet">
      <button type="button" class="ps-close" aria-label="Close" onclick="closeProductSheet()">×</button>
      <div class="ps-photo" id="psPhoto"></div>
      <div class="ps-body">
        <div class="ps-cat" id="psCat"></div>
        <h2 class="ps-name" id="psName"></h2>
        <div id="psBadges"></div>
        <div class="ps-label" id="psPackLabel">Choose your pack</div>
        <div class="ps-packs" id="psPacks" role="radiogroup" aria-labelledby="psPackLabel"></div>
        <div class="ps-notes" id="psNotes"></div>
      </div>
      <div class="ps-bar" id="psBar"></div>

  </div>

  <!-- TOASTS -->
  <div class="toast" id="toastEl"></div>
  <div class="toast-top" id="toastTopEl"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script src="pricing.js"></script>
  <script src="shelf-order.js"></script>
  <script>
  renderNavAuth();

  // Cooler Box rules — shared with server.js via pricing.js, see
  // that file for why (used to be copy-pasted separately in 3 places).
  const { COOLER_ELIGIBLE, COOLER_MIN_SUBTOTAL, COOLER_DISCOUNT_PCT, COOLER_TOP_SUBTOTAL, COOLER_TOP_DISCOUNT_PCT, coolerDiscountAvailable } = EkoyiniPricing;

  let cart = EkoyiniCart.get();
  let products = [];

  // Occasion collections — each links here as shop.html?cats=A,B,C so the
  // homepage's "Today's Deals" cards can deep-link to a pre-filtered view
  // instead of dumping everyone on the full 18-category catalog.
  const COLLECTIONS = {
    festive: { label: 'Festive Season Crate', cats: ['BEER', 'SPARKLING', 'CHAMPAGNE', 'WHISKY', 'MIXER', 'ICE'] },
    braai: { label: 'Weekend Braai Pack', cats: ['BEER', 'CIDER_RTD', 'MIXER', 'ICE'] },
    stokvel: { label: 'Stokvel & Party Case', cats: ['BRANDY', 'WHISKY', 'BEER', 'MIXER'] },
    chill: { label: 'Chill Session', cats: ['CIDER_RTD', 'WINE', 'SPARKLING'] },
  };

  const params = new URLSearchParams(window.location.search);
  let searchQuery = (params.get('q') || '').trim();
  let categoryFilter = null; // null = show every category
  let collectionLabel = null;
  if (params.get('cats')) {
    categoryFilter = new Set(params.get('cats').split(',').map((c) => c.trim()).filter(Boolean));
  } else if (params.get('collection') && COLLECTIONS[params.get('collection')]) {
    const c = COLLECTIONS[params.get('collection')];
    categoryFilter = new Set(c.cats);
    collectionLabel = c.label;
  }

  function fmtPrice(v) { return v == null ? 'POA' : 'R' + v.toFixed(2); }

  // Products added with a photo but no price yet are stored with a price of 0.
  function isPriced(p) { return p.retailSingleZAR > 0; }

  // Dumpies and cans are only sold as six-packs (packSize 6) — the price
  // shown is for the whole pack, so the card says so.
  function isPack(p) { return p.packSize > 1; }
  function sizeLabel(p) {
    return isPack(p) ? `${p.bottleFormat} · ${p.packSize}-pack` : p.bottleFormat;
  }

  // Product names/sizes go into innerHTML, so they are escaped first.
  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  let showFavoritesOnly = false;

  // Brand story filters — a product must carry EVERY active tag (so
  // "Black Owned" + "Women Owned" together means both, not either).
  const BRAND_TAG_LABELS = { BLACK_OWNED: 'Black Owned', WOMEN_OWNED: 'Women Owned', CELEBRITY_BACKED: 'Celebrity Backed' };
  // shop.html?tag=BLACK_OWNED (from the homepage Brand Stories cards)
  // pre-selects that filter. Unknown values are ignored.
  let activeBrandFilters = new Set(
    (params.get('tag') || '').split(',').map((t) => t.trim()).filter((t) => BRAND_TAG_LABELS[t])
  );
  activeBrandFilters.forEach((t) => {
    const pill = document.querySelector(`.brand-filter-pill[data-tag="${t}"]`);
    pill?.classList.add('active');
    pill?.setAttribute('aria-pressed', 'true');
  });

  function toggleBrandFilter(tag) {
    if (activeBrandFilters.has(tag)) activeBrandFilters.delete(tag); else activeBrandFilters.add(tag);
    const pill = document.querySelector(`.brand-filter-pill[data-tag="${tag}"]`);
    pill.classList.toggle('active', activeBrandFilters.has(tag));
    pill.setAttribute('aria-pressed', String(activeBrandFilters.has(tag)));
    buildCatalog();
  }
  window.toggleBrandFilter = toggleBrandFilter;

  // "bains" finds "Bain's", "jameson 750" finds the 750ml bottle: every
  // word must appear in the name, type, size or category, ignoring case,
  // accents and punctuation.
  function normalise(text) {
    return String(text || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[’'`.]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  }
  function searchText(p) {
    if (!p._search) p._search = normalise([p.name, p.productType, p.bottleFormat, categoryLabel(p.category)].join(' '));
    return p._search;
  }
  function getFilteredProducts() {
    const terms = normalise(searchQuery).split(' ').filter(Boolean);
    return products.filter((p) => {
      if (showFavoritesOnly && !EkoyiniFavorites.has(p.id)) return false;
      if (categoryFilter && !categoryFilter.has(p.category)) return false;
      if (activeBrandFilters.size > 0) {
        const tags = p.brandTags || [];
        for (const t of activeBrandFilters) { if (!tags.includes(t)) return false; }
      }
      if (terms.length) {
        const hay = searchText(p);
        if (!terms.every((t) => hay.includes(t))) return false;
      }
      return true;
    });
  }

  function brandBadgesHTML(p) {
    if (!p.brandTags || p.brandTags.length === 0) return '';
    return `<div class="brand-badges">${p.brandTags.map(t => `<span class="tag-gold">${BRAND_TAG_LABELS[t] || t}</span>`).join('')}</div>`;
  }

  // Fixed square photo box. If the photo fails to load, it is swapped for the
  // product's first letter so the card keeps exactly the same layout.
  function productImageHTML(p) {
    const letter = esc((p.name || '?').trim().charAt(0).toUpperCase());
    if (!p.imageUrl) return `<div class="product-img-box"><span class="img-fallback">${letter}</span></div>`;
    return `<div class="product-img-box">
      <img src="${esc(p.imageUrl)}" alt="${esc(p.name)}" loading="lazy" decoding="async"
        onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'img-fallback',textContent:'${letter}'}))">
    </div>`;
  }

  // ── HERO AISLE BANNER ──
  // Founder, 10 Nov 2026: stylish cards that show real products, built so
  // each aisle can later be SOLD to a brand partner (SAB, Distell/Heineken,
  // Pernod Ricard, Diageo...). To feature a partner, change that aisle's
  // `featured` block: its label ("Featured: SAB"), the product photos
  // (trimmed copies in /images/promo/) and the search the card opens.
  // Cloudflare Web Analytics counts the shop's visitors for those talks.
  const AISLES = [
    { key: 'beer', label: 'Beer & Cider', sub: 'Six-packs of cans and dumpies, quarts and RTDs.', cats: ['BEER', 'CIDER_RTD'],
      theme: 'a-beer', featured: { label: 'Cold ones', art: ['castle-lite-can', 'black-label-quart', 'savanna-dry'], q: '' } },
    { key: 'liquor', label: 'Spirits', sub: 'Whisky, brandy, cognac, gin, vodka and tequila.', cats: ['BRANDY', 'WHISKY', 'COGNAC', 'GIN', 'VODKA', 'VODKA_PREMIUM', 'RUM', 'TEQUILA', 'TEQUILA_PREMIUM', 'LIQUEUR'],
      theme: 'a-spirits', featured: { label: 'Top shelf', art: ['hennessy-vs', 'jw-black', 'klipdrift-export'], q: '' } },
    { key: 'wine', label: 'Wine & Bubbly', sub: 'Reds, whites and something to pop.', cats: ['WINE', 'WINE_BOX', 'SPARKLING', 'CHAMPAGNE'],
      theme: 'a-wine', featured: { label: 'For the table', art: ['4th-street-sweet-red', 'moet', 'jc-le-roux'], q: '' } },
    { key: 'mixers', label: 'Mixers & Essentials', sub: 'Cold drinks, energy drinks, water and ice.', cats: ['MIXER', 'ENERGY_DRINK', 'WATER', 'ICE', 'WATER_ICE'],
      theme: 'a-mixers', featured: { label: 'Cooler box basics', art: ['red-bull', 'coca-cola-2l', 'appletiser'], q: '' } },
  ];

  // Shelf order is shared with the server and admin (shelf-order.js).
  const { shelfOf, compareShelf } = window.EkoyiniShelf;

  function aisleIndexForCategory(cat) {
    return AISLES.findIndex(a => a.cats.includes(cat));
  }

  function buildHero() {
    const hero = document.getElementById('shopHero');
    const dotsHolder = document.getElementById('shopHeroDots');
    AISLES.forEach((a, i) => {
      const slide = document.createElement('div');
      slide.className = `shop-hero-slide ${a.theme}` + (i === 0 ? ' active' : '');
      slide.dataset.aisle = a.key;
      slide.setAttribute('role', 'button');
      slide.setAttribute('aria-label', `${a.label}: ${a.sub}`);
      slide.onclick = () => { if (a.featured.q) { location.href = `shop.html?q=${encodeURIComponent(a.featured.q)}`; return; } setActivePill(a.cats[0]); scrollToSection(a.cats[0]); };
      slide.innerHTML = `
        <div class="sh-copy">
          <div class="sh-kicker">${esc(a.featured.label)}</div>
          <div class="sh-title">${esc(a.label)}</div>
          <div class="sh-sub">${esc(a.sub)}</div>
          <span class="sh-cta">Shop now <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
        </div>
        <div class="sh-art" aria-hidden="true">${a.featured.art.map((k) => `<img src="images/promo/${k}.webp" alt="" loading="lazy" decoding="async">`).join('')}</div>`;
      hero.insertBefore(slide, dotsHolder);
    });
    dotsHolder.innerHTML = AISLES.map((a, i) => `<div class="shop-hero-dot${i === 0 ? ' active' : ''}" onclick="setAisle(${i})"></div>`).join('');
    attachHeroSwipe(hero);
  }

  // Swipe left/right on the banner itself to move between aisles — the
  // dots imply swipeability, so tapping a category pill shouldn't be the
  // only way to move the carousel.
  function attachHeroSwipe(hero) {
    let startX = 0;
    let startY = 0;
    let tracking = false;
    hero.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });
    hero.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      // Ignore mostly-vertical swipes (the page itself needs to scroll).
      if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
      const next = activeAisleIndex + (dx < 0 ? 1 : -1);
      setAisle(Math.max(0, Math.min(AISLES.length - 1, next)));
    }, { passive: true });
  }

  let activeAisleIndex = 0;
  function setAisle(index) {
    if (index === -1 || index === activeAisleIndex) return;
    const slides = Array.from(document.querySelectorAll('.shop-hero-slide'));
    const dots = Array.from(document.querySelectorAll('.shop-hero-dot'));
    const prevSlide = slides[activeAisleIndex];
    if (prevSlide) {
      prevSlide.classList.remove('active');
      prevSlide.classList.add('prev');
      setTimeout(() => prevSlide.classList.remove('prev'), 450);
    }
    if (slides[index]) slides[index].classList.add('active');
    dots.forEach((d, i) => d.classList.toggle('active', i === index));
    activeAisleIndex = index;
  }
  window.setAisle = setAisle;

  function toggleFavoritesOnly() {
    showFavoritesOnly = !showFavoritesOnly;
    document.getElementById('favToggle').classList.toggle('active', showFavoritesOnly);
    document.getElementById('favToggle').setAttribute('aria-pressed', String(showFavoritesOnly));
    buildCatalog();
  }

  function toggleFavorite(id, btn) {
    const justAdded = EkoyiniFavorites.toggle(id);
    btn.classList.toggle('active', justAdded);
    btn.setAttribute('aria-pressed', String(justAdded));
    showToastTop(justAdded ? 'Saved to Favourites' : 'Removed from Favourites');
    btn.querySelector('svg').setAttribute('fill', justAdded ? 'currentColor' : 'none');
    if (showFavoritesOnly && !justAdded) buildCatalog();
  }

  // Debounced — avoids rebuilding the whole grid on every keystroke.
  let searchDebounce;
  function applySearch() {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => {
      searchQuery = document.getElementById('shopSearch').value.trim();
      document.getElementById('searchClear').style.display = searchQuery ? 'block' : 'none';
      buildCatalog();
    }, 200);
  }

  function clearSearch() {
    document.getElementById('shopSearch').value = '';
    searchQuery = '';
    document.getElementById('searchClear').style.display = 'none';
    buildCatalog();
  }

  function renderSkeleton() {
    const page = document.getElementById('shopPage');
    const grid = document.createElement('div');
    grid.className = 'product-grid';
    for (let i = 0; i < 6; i++) {
      const s = document.createElement('div');
      s.className = 'skel-product-card';
      grid.appendChild(s);
    }
    page.innerHTML = '';
    page.appendChild(grid);
  }

  async function loadCatalog() {
    renderSkeleton();
    try {
      const res = await fetch('/api/products');
      if (!res.ok) throw new Error('Bad response');
      products = await res.json();
      cart = EkoyiniCart.reconcile(products).cart;
      buildCatalog();
      updateBadges();
      updateCoolerBox();
    } catch (err) {
      console.error('Failed to load catalog:', err);
      document.getElementById('shopPage').innerHTML = `
        <div class="retry-state">
          We couldn't load the shelves — check your connection.
          <div><button type="button" onclick="loadCatalog()">Try again</button></div>
        </div>`;
    }
  }

  function buildCatalog() {
    const page = document.getElementById('shopPage');
    const pills = document.getElementById('catPills');
    page.innerHTML = '';
    pills.innerHTML = '';

    const banner = document.getElementById('collectionBanner');
    if (collectionLabel) {
      document.getElementById('collectionLabel').textContent = `Showing: ${collectionLabel}`;
      banner.style.display = 'flex';
    } else {
      banner.style.display = 'none';
    }

    const filtered = getFilteredProducts();
    const filtering = !!(searchQuery || showFavoritesOnly || activeBrandFilters.size || categoryFilter);
    document.getElementById('resultCount').textContent = filtering && filtered.length
      ? `${filtered.length} drink${filtered.length === 1 ? '' : 's'} found` : '';
    // Shelf order (founder, 9 Nov 2026): sections in a fixed, sensible order,
    // brands kept together, packs in can → dumpy → NRB → quart → bottle order,
    // and in-stock before sold-out so a shelf never leads with "Out of Stock".
    filtered.sort(compareShelf);
    const byCategory = {};
    filtered.forEach(p => {
      const shelf = shelfOf(p.category);
      if (!byCategory[shelf]) byCategory[shelf] = [];
      byCategory[shelf].push(p);
    });

    if (filtered.length === 0) {
      const noResultsMsg = showFavoritesOnly
        ? 'No favorites yet — tap the heart on a product to save it here.'
        : activeBrandFilters.size > 0
          ? `No products currently match ${[...activeBrandFilters].map(t => BRAND_TAG_LABELS[t]).join(' + ')} — we only tag a brand once its story is actually verified, so this list grows as we source more.`
          : `No products match${searchQuery ? ` "${esc(searchQuery)}"` : ' this filter'}.`;
      page.innerHTML = `<div class="no-results">${noResultsMsg} <a href="shop.html" style="color:var(--terra-light);">Show everything</a></div>`;
      if (sectionObserver) sectionObserver.disconnect();
      return;
    }

    let first = true;
    Object.entries(byCategory).forEach(([cat, items]) => {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'pill-tag' + (first ? ' active' : '');
      pill.dataset.cat = cat;
      pill.setAttribute('role', 'tab');
      pill.textContent = categoryLabel(cat);
      pill.onclick = () => {
        setActivePill(cat);
        scrollToSection(cat);
        setAisle(aisleIndexForCategory(cat));
      };
      pills.appendChild(pill);

      const sec = document.createElement('div');
      sec.className = 'cat-section';
      sec.id = 'sec-' + cat;
      sec.innerHTML = `<div class="cat-section-header">
        <h2>${esc(categoryLabel(cat))}</h2>
        <span class="cat-count">${items.length} item${items.length === 1 ? '' : 's'}</span>
      </div>`;
      const grid = document.createElement('div');
      grid.className = 'product-grid';
      items.forEach(p => {
        const outOfStock = p.stock <= 0;
        const priced = isPriced(p);
        const card = document.createElement('div');
        card.className = 'product-card' + (outOfStock ? ' out-of-stock' : '');
        card.id = 'card-' + p.id;
        const isFav = EkoyiniFavorites.has(p.id);
        card.innerHTML = `
          <button type="button" class="fav-btn${isFav ? ' active' : ''}" aria-pressed="${isFav}" aria-label="Save ${esc(p.name)} to Favourites" onclick="toggleFavorite('${p.id}', this)">
            <svg viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
          ${outOfStock ? '<div class="stock-badge">Out of Stock</div>' : ''}
          <div onclick="openProductSheet('${p.id}')">${productImageHTML(p)}</div>
          <div class="product-info">
            <h3 onclick="openProductSheet('${p.id}')">${esc(p.name)}</h3>
            ${brandBadgesHTML(p)}
            <div class="product-size">${esc(sizeLabel(p))}</div>
            <div class="product-footer">
              ${priced
                ? `<div class="product-price" onclick="showPriceDetails('${p.id}')">${fmtPrice(p.retailSingleZAR)}</div>`
                : `<div class="price-soon">Price coming soon</div>`}
              <div id="ctrl-${p.id}">${qtyControlHTML(p)}</div>
            </div>
          </div>`;
        grid.appendChild(card);
      });
      sec.appendChild(grid);
      page.appendChild(sec);
      first = false;
    });

    // Keep the hero banner honest even when a deep link (collection,
    // search, or a brand filter) means the first section isn't BEER.
    const firstCat = Object.keys(byCategory)[0];
    if (firstCat) setAisle(aisleIndexForCategory(firstCat));
    observeSections();
  }

  // ── Category bar follows your scroll (scroll-spy) ──
  let sectionObserver = null;
  let spyPausedUntil = 0;
  function setActivePill(cat) {
    const pills = document.querySelectorAll('#catPills .pill-tag');
    pills.forEach((p) => {
      const on = p.dataset.cat === cat;
      p.classList.toggle('active', on);
      p.setAttribute('aria-selected', String(on));
      if (on) p.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    });
  }
  function stickyOffset() {
    const nav = document.querySelector('.navbar');
    return (nav ? nav.offsetHeight : 60) + document.getElementById('shopSticky').offsetHeight + 8;
  }
  function scrollToSection(cat) {
    const sec = document.getElementById('sec-' + cat);
    if (!sec) return;
    spyPausedUntil = Date.now() + 900; // don't let the spy fight the jump
    window.scrollTo({ top: sec.getBoundingClientRect().top + window.scrollY - stickyOffset(), behavior: 'smooth' });
  }
  function observeSections() {
    if (sectionObserver) sectionObserver.disconnect();
    if (!('IntersectionObserver' in window)) return;
    sectionObserver = new IntersectionObserver((entries) => {
      if (Date.now() < spyPausedUntil) return;
      const visible = entries.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (visible) setActivePill(visible.target.id.slice(4));
    }, { rootMargin: `-${stickyOffset()}px 0px -60% 0px` });
    document.querySelectorAll('.cat-section').forEach((s) => sectionObserver.observe(s));
  }
  // Shadow under the sticky bar only once it's actually stuck.
  window.addEventListener('scroll', () => {
    const bar = document.getElementById('shopSticky');
    bar.classList.toggle('is-stuck', bar.getBoundingClientRect().top <= (document.querySelector('.navbar')?.offsetHeight || 60) + 1);
  }, { passive: true });

  // Shared by the initial card render (inline, so the button paints on
  // first load — see the buildCatalog() comment on why it can't go
  // through renderQtyControl there) and every re-render after a click.
  function qtyControlHTML(p) {
    if (!isPriced(p)) return `<span class="add-btn-disabled">Soon</span>`;
    if (p.stock <= 0) return `<span class="add-btn-disabled">Unavailable</span>`;
    const qty = cart[p.id] || 0;
    if (qty > 0) {
      return `
        <div class="stepper-inline">
          <button type="button" aria-label="One less ${esc(p.name)}" onclick="changeQty('${p.id}', -1)">−</button>
          <span aria-live="polite">${qty}</span>
          <button type="button" aria-label="One more ${esc(p.name)}" onclick="changeQty('${p.id}', 1)">+</button>
        </div>`;
    }
    return `<button type="button" class="add-btn" aria-label="Add ${esc(p.name)} to cart" onclick="changeQty('${p.id}', 1)">+</button>`;
  }

  function renderQtyControl(id) {
    const holder = document.getElementById('ctrl-' + id);
    const p = products.find(x => x.id === id);
    if (!holder || !p) return;
    holder.innerHTML = qtyControlHTML(p);
  }

  function changeQty(id, delta) {
    const p = products.find(x => x.id === id);
    if (p && !isPriced(p)) return; // not orderable until it has a price
    const newQty = (cart[id] || 0) + delta;
    if (newQty <= 0) delete cart[id]; else cart[id] = newQty;
    EkoyiniCart.save(cart);
    renderQtyControl(id);
    updateBadges();
    updateCoolerBox();
    if (delta > 0 && newQty === 1) showToastTop(`Added ${p ? p.name : ''} to cart`);
    if (delta > 0 && navigator.vibrate) { try { navigator.vibrate(8); } catch {} }
  }

  function updateBadges() {
    const count = Object.values(cart).reduce((a, b) => a + b, 0);
    document.getElementById('navCartCount').textContent = count;
    const bn = document.getElementById('bnavCartCount');
    bn.textContent = count;
    bn.style.display = count > 0 ? 'flex' : 'none';
    updateCartFab(count);
  }

  // Floating "View cart" bar: item count and running subtotal.
  function updateCartFab(count) {
    const fab = document.getElementById('cartFab');
    if (!fab) return;
    let total = 0;
    Object.entries(cart).forEach(([id, qty]) => {
      const p = products.find(x => x.id === id);
      if (p && p.retailSingleZAR > 0) total += p.retailSingleZAR * qty;
    });
    document.getElementById('cfCount').textContent = count;
    document.getElementById('cfTotal').textContent = formatRand(total);
    fab.hidden = count <= 0;
  }

  // Tapping the "Cooler Box" badge on any category header jumps to the
  // actual builder widget so a shopper can see their fill progress. The
  // widget only renders once something eligible is in the cart (it's
  // display:none otherwise, so scrollIntoView would silently do nothing) —
  // nudge them to add something first instead of scrolling to a blank spot.
  function scrollToCoolerBox() {
    const bar = document.getElementById('coolerBar');
    if (bar.style.display === 'none' || !bar.offsetParent) {
      showToast(`Add any drink to start filling your Cooler Box — ${COOLER_DISCOUNT_PCT * 100}% off from R${COOLER_MIN_SUBTOTAL}, until 8pm`);
      return;
    }
    bar.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  window.scrollToCoolerBox = scrollToCoolerBox;

  function updateCoolerBox() {
    const bar = document.getElementById('coolerBar');
    const eligibleEntries = Object.entries(cart).filter(([id]) => {
      const p = products.find(x => x.id === id);
      return p && COOLER_ELIGIBLE.has(p.category);
    });

    if (eligibleEntries.length === 0) { bar.style.display = 'none'; return; }
    bar.style.display = 'block';

    let subtotal = 0;
    eligibleEntries.forEach(([id, qty]) => {
      const p = products.find(x => x.id === id);
      subtotal += p.retailSingleZAR * qty;
    });

    document.getElementById('coolerTotal').textContent = fmtPrice(subtotal);
    const pct = Math.min(100, (subtotal / COOLER_MIN_SUBTOTAL) * 100);
    document.getElementById('coolerFill').style.width = pct + '%';

    const open = coolerDiscountAvailable(new Date());
    const unlocked = open && subtotal >= COOLER_MIN_SUBTOTAL;
    const goal = document.getElementById('coolerGoal');
    goal.classList.toggle('hit', unlocked);
    if (!open) {
      goal.textContent = 'Cooler Box discount is available until 8pm';
    } else if (subtotal >= COOLER_TOP_SUBTOTAL) {
      goal.textContent = `${COOLER_TOP_DISCOUNT_PCT * 100}% off unlocked`;
    } else if (unlocked) {
      goal.textContent = `${COOLER_DISCOUNT_PCT * 100}% off unlocked · ${COOLER_TOP_DISCOUNT_PCT * 100}% from R${COOLER_TOP_SUBTOTAL}`;
    } else {
      goal.textContent = `Add ${formatRand(COOLER_MIN_SUBTOTAL - subtotal)} for ${COOLER_DISCOUNT_PCT * 100}% off, until 8pm`;
    }

    const slots = document.getElementById('coolerSlots');
    slots.innerHTML = '';
    for (let i = 0; i < 8; i++) {
      const entry = eligibleEntries[i];
      const slot = document.createElement('div');
      slot.className = 'cooler-slot' + (entry ? ' filled' : '');
      if (entry) {
        const p = products.find(x => x.id === entry[0]);
        slot.title = `${p.name} × ${entry[1]}`;
      }
      slots.appendChild(slot);
    }
  }

  function showPriceDetails(id) {
    const p = products.find(x => x.id === id);
    if (!p || !isPriced(p)) return;
    document.getElementById('modalTitle').textContent = p.name;
    const perUnitCase = p.retailCaseZAR / p.unitsPerCase;
    const unitName = isPack(p) ? `${p.packSize}-pack` : 'bottle';
    const unitsName = isPack(p) ? `${p.packSize}-packs` : 'units';
    document.getElementById('priceDetailsBody').innerHTML = `
      <div class="price-details-row"><span class="pd-label">Single ${unitName}</span><span class="pd-value">${fmtPrice(p.retailSingleZAR)}</span></div>
      <div class="price-details-row"><span class="pd-label">Case (${p.unitsPerCase} ${unitsName})</span><span class="pd-value">${fmtPrice(p.retailCaseZAR)}</span></div>
      <div class="price-details-row"><span class="pd-label">Per ${unitName} (case)</span><span class="pd-value">${fmtPrice(perUnitCase)}</span></div>
      <div class="price-details-row"><span class="pd-label">Case savings</span><span class="price-details-save">${p.retailCaseDiscountPct}% off</span></div>`;
    document.getElementById('priceModal').classList.add('open');
  }

  function closeModal() { document.getElementById('priceModal').classList.remove('open'); }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); closeProductSheet(); } });

  // ── Product sheet ──
  let sheetId = null;   // the pack being looked at
  let sheetQty = 1;     // how many to add
  function siblingsOf(p) {
    return products.filter((x) => x.name === p.name)
      .sort((a, b) => EkoyiniShelf.packRank(a.bottleFormat) - EkoyiniShelf.packRank(b.bottleFormat)
        || String(a.bottleFormat).localeCompare(String(b.bottleFormat), undefined, { numeric: true }));
  }
  function packTitle(p) {
    const f = String(p.bottleFormat);
    const kind = /^Can/.test(f) ? 'Cans' : /^Dumpy/.test(f) ? 'Dumpies' : /^NRB/.test(f) ? 'Bottles' : /^Quart/.test(f) ? 'Quart' : f.replace(/\s*\(.*$/, '');
    const size = (f.match(/\(([^)]+)\)/) || [])[1] || '';
    return { kind: isPack(p) ? `${p.packSize} ${kind.toLowerCase()}` : kind, size: size || f };
  }
  function openProductSheet(id) {
    const p = products.find((x) => x.id === id);
    if (!p) return;
    sheetId = id;
    sheetQty = 1;
    renderProductSheet();
    document.getElementById('productSheet').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeProductSheet() {
    const el = document.getElementById('productSheet');
    if (!el.classList.contains('open')) return;
    el.classList.remove('open');
    document.body.style.overflow = '';
  }
  function pickSheetPack(id) { sheetId = id; sheetQty = 1; renderProductSheet(); }
  function sheetStep(d) { sheetQty = Math.max(1, Math.min(sheetQty + d, 99)); renderProductSheet(); }
  function addFromSheet() {
    const p = products.find((x) => x.id === sheetId);
    if (!p || !isPriced(p) || p.stock <= 0) return;
    const inCart = cart[p.id] || 0;
    const add = Math.min(sheetQty, Math.max(0, (p.stock || 99) - inCart));
    if (add <= 0) { showToastTop('That\u2019s all we have in stock'); return; }
    for (let i = 0; i < add; i++) changeQty(p.id, 1);
    closeProductSheet();
  }
  function renderProductSheet() {
    const p = products.find((x) => x.id === sheetId);
    if (!p) return;
    const letter = esc((p.name || '?').trim().charAt(0).toUpperCase());
    document.getElementById('psPhoto').innerHTML = p.imageUrl
      ? `<img src="${esc(p.imageUrl)}" alt="${esc(p.name)} ${esc(p.bottleFormat)}">`
      : `<span class="img-fallback">${letter}</span>`;
    document.getElementById('psCat').textContent = categoryLabel(p.category);
    document.getElementById('psName').textContent = p.name;
    document.getElementById('psBadges').innerHTML = brandBadgesHTML(p);
    const packs = siblingsOf(p);
    document.getElementById('psPackLabel').textContent = packs.length > 1 ? 'Choose your pack' : 'Pack';
    document.getElementById('psPacks').innerHTML = packs.map((x) => {
      const t = packTitle(x);
      const off = !isPriced(x) || x.stock <= 0;
      const inCart = cart[x.id] || 0;
      return `<button type="button" class="ps-pack${x.id === p.id ? ' on' : ''}" role="radio" aria-checked="${x.id === p.id}" ${off ? 'disabled' : ''} onclick="pickSheetPack('${x.id}')">
        <b>${esc(t.kind)}</b><span>${esc(t.size)}</span>
        <strong>${off ? 'Unavailable' : fmtPrice(x.retailSingleZAR)}</strong>
        ${inCart ? `<em>${inCart} in cart</em>` : ''}
      </button>`;
    }).join('');
    const notes = [];
    if (EkoyiniPricing.isReturnableQuart(p.name, p.bottleFormat)) {
      notes.push(`<div class="ps-note"><span>♻️</span><span><b>Returnable quart.</b> Bottles are R${EkoyiniPricing.BOTTLE_DEPOSIT_LOOSE} each, or R${EkoyiniPricing.CRATE_SIZE * EkoyiniPricing.BOTTLE_DEPOSIT_IN_CRATE + EkoyiniPricing.CRATE_FEE} for a crate of ${EkoyiniPricing.CRATE_SIZE}. You keep them; you choose crate or loose at checkout.</span></div>`);
    }
    if (isPack(p)) notes.push(`<div class="ps-note"><span>📦</span><span>Sold as a <b>${p.packSize}-pack</b>. The price is for all ${p.packSize}.</span></div>`);
    if (p.unitsPerCase > 1 && p.retailCaseDiscountPct > 0) {
      notes.push(`<div class="ps-note"><span>🏷️</span><span>A case of ${p.unitsPerCase} is <b>${fmtPrice(p.retailCaseZAR)}</b> (${p.retailCaseDiscountPct}% off). Switch to cases in your cart.</span></div>`);
    }
    if (COOLER_ELIGIBLE.has(p.category)) {
      notes.push(`<div class="ps-note"><span>🧊</span><span>Counts toward your <b>Cooler Box</b>: ${COOLER_DISCOUNT_PCT * 100}% off from R${COOLER_MIN_SUBTOTAL}, ${COOLER_TOP_DISCOUNT_PCT * 100}% from R${COOLER_TOP_SUBTOTAL}, until 8pm.</span></div>`);
    }
    if (EkoyiniPricing.SPIRIT_CATEGORIES.has(p.category)) {
      notes.push(`<div class="ps-note"><span>🔒</span><span>Add a <b>R${EkoyiniPricing.SAFETY_SEAL_FEE} Safety Seal</b> at checkout and your bottle is sealed at the tavern.</span></div>`);
    }
    document.getElementById('psNotes').innerHTML = notes.join('');
    const ok = isPriced(p) && p.stock > 0;
    document.getElementById('psBar').innerHTML = ok
      ? `<div class="ps-qty"><button type="button" aria-label="One less" onclick="sheetStep(-1)">−</button><b aria-live="polite">${sheetQty}</b><button type="button" aria-label="One more" onclick="sheetStep(1)">+</button></div>
         <button type="button" class="ps-add" onclick="addFromSheet()"><span>Add to cart</span><span>${fmtPrice(p.retailSingleZAR * sheetQty)}</span></button>`
      : `<button type="button" class="ps-add" disabled><span>Unavailable right now</span><span></span></button>`;
  }
  window.openProductSheet = openProductSheet;
  window.closeProductSheet = closeProductSheet;
  window.pickSheetPack = pickSheetPack;
  window.sheetStep = sheetStep;
  window.addFromSheet = addFromSheet;

  function saveAddress() {
    const input = document.getElementById('shopAddress');
    const v = input.value.trim();
    if (v.length < 5) { showToast('Please enter your full street address'); input.focus(); return; }
    EkoyiniAddress.save(v);
    input.blur();
    showToast('Delivery address saved');
  }

  // Live re-sync if the cart changes in another tab.
  window.addEventListener('ekoyini:cart-updated', () => {
    cart = EkoyiniCart.get();
    products.forEach(p => renderQtyControl(p.id));
    updateBadges();
    updateCoolerBox();
  });

  // Init
  const addr = EkoyiniAddress.get();
  if (addr) document.getElementById('shopAddress').value = addr;
  if (searchQuery) {
    document.getElementById('shopSearch').value = searchQuery;
    document.getElementById('searchClear').style.display = 'block';
  }
  document.getElementById('shopSearch').addEventListener('input', applySearch);
  buildHero();
  if (requireAgeGate()) loadCatalog();
  </script>
  <script src="/analytics.js" defer></script>
</body>
</html>
