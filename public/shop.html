<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ekoyini — Shop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .price-edit-hint {
      background: rgba(46,171,94,0.08); border: 1px solid rgba(46,171,94,0.2);
      border-radius: 8px; padding: 9px 14px; margin: 10px 12px 0;
      font-size: 11px; color: var(--green-light);
      display: flex; align-items: center; gap: 8px;
    }
    .cat-section { margin-bottom: 24px; }
    .cat-section-header {
      display: flex; align-items: center; gap: 8px;
      padding: 16px 16px 10px;
      border-top: 1px solid var(--border);
    }
    .cat-section-header h2 {
      font-family: var(--font-display);
      font-size: 16px; color: var(--white); flex: 1;
    }
    .cat-section-header .cat-count {
      font-size: 10px; color: var(--muted);
      background: var(--card); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 10px;
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="back-arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="logo">
      <img src="logo.png" alt="Ekoyini">
      <div class="logo-text">Eko<span style="color:var(--green-light)">yini</span></div>
    </div>
    <a href="cart.html" class="nav-icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span class="badge" id="navCartCount">0</span>
    </a>
  </nav>

  <!-- ADDRESS -->
  <div class="address-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
    </svg>
    <input type="text" id="shopAddress" placeholder="Enter delivery address">
    <button class="addr-save" onclick="saveAddress()">Save</button>
  </div>

  <!-- CATEGORY PILLS -->
  <div class="pill-scroll" id="catPills"></div>

  <!-- PRICE EDIT HINT -->
  <div class="price-edit-hint">✏️ Tap any price to override — changes saved locally. Supplier sync coming soon.</div>

  <!-- PRODUCT SECTIONS -->
  <div class="page" id="shopPage" style="padding-top:8px"></div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="index.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="shop.html" class="bnav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Shop
    </a>
    <a href="cart.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Cart
      <span class="bnav-badge" id="bnavCartCount" style="display:none">0</span>
    </a>
    <a href="#" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Track
    </a>
    <a href="#" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <!-- PRICE EDIT MODAL -->
  <div class="modal-overlay" id="priceModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h3 id="modalTitle">Edit Price</h3>
      <input type="number" id="modalInput" placeholder="Enter price (ZAR)">
      <div class="modal-btns">
        <button class="btn-save" onclick="savePrice()">Save Override</button>
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- CART TOAST -->
  <div class="toast" id="toastEl"></div>

  <script src="script.js"></script>
  <script>
  const cart = JSON.parse(localStorage.getItem('ekoyini_cart') || '{}');
  let products = [];
  let editingId = null;

  function fmtPrice(v) { return v == null ? 'POA' : 'R' + v.toFixed(2); }

  async function loadCatalog() {
    try {
      const res = await fetch('/api/products');
      products = await res.json();
      buildCatalog();
      updateBadges();
    } catch (err) {
      console.error('Failed to load catalog:', err);
      showToast('❌ Failed to load products');
    }
  }

  function buildCatalog() {
    const page = document.getElementById('shopPage');
    const pills = document.getElementById('catPills');
    page.innerHTML = '';
    pills.innerHTML = '';

    // Group by category
    const byCategory = {};
    products.forEach(p => {
      if (!byCategory[p.category]) byCategory[p.category] = [];
      byCategory[p.category].push(p);
    });

    const categoryEmojis = {
      BEER: '🍺', CIDER_RTD: '🍏', BRANDY: '🥃', WHISKY: '🥃',
      COGNAC: '🍷', GIN: '🍸', VODKA: '🧊', VODKA_PREMIUM: '🧊',
      TEQUILA: '🌵', TEQUILA_PREMIUM: '🌵', LIQUEUR: '🍹', MIXER: '🫙',
      WINE: '🍷', WINE_BOX: '🍷', SPARKLING: '🥂', CHAMPAGNE: '🥂',
    };

    let first = true;
    Object.entries(byCategory).forEach(([cat, items]) => {
      // Pill
      const pill = document.createElement('div');
      pill.className = 'pill-tag' + (first ? ' active' : '');
      pill.textContent = (categoryEmojis[cat] || '📦') + ' ' + cat.replace(/_/g, ' ');
      pill.onclick = () => {
        document.querySelectorAll('.pill-tag').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        document.getElementById('sec-' + cat)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      pills.appendChild(pill);

      // Section
      const sec = document.createElement('div');
      sec.className = 'cat-section';
      sec.id = 'sec-' + cat;
      sec.innerHTML = `<div class="cat-section-header">
        <h2>${categoryEmojis[cat] || '📦'} ${cat.replace(/_/g, ' ')}</h2>
        <span class="cat-count">${items.length} items</span>
      </div>`;
      const grid = document.createElement('div');
      grid.className = 'product-grid';
      items.forEach(p => {
        const qty = cart[p.id] || 0;
        const card = document.createElement('div');
        card.className = 'product-card';
        card.id = 'card-' + p.id;
        card.innerHTML = `
          <div class="product-img" style="background-image: url('${p.imageUrl || ''}'); background-size: cover; background-position: center;"></div>
          <div class="product-info">
            <h3>${p.name}</h3>
            <div class="product-size">${p.bottleFormat}</div>
            <div class="product-footer">
              <div class="product-price" onclick="openModal('${p.id}','${p.name.replace(/'/g, '\\"')}')" title="Single: ${fmtPrice(p.retailSingleZAR)}, Case: ${fmtPrice(p.retailCaseZAR)} (${p.retailCaseDiscountPct}% off)">
                ${fmtPrice(p.retailSingleZAR)}
              </div>
              <button class="add-btn ${qty > 0 ? 'added' : ''}" id="btn-${p.id}" onclick="addToCart('${p.id}')">
                ${qty > 0 ? qty : '+'}
              </button>
            </div>
          </div>`;
        grid.appendChild(card);
      });
      sec.appendChild(grid);
      page.appendChild(sec);
      first = false;
    });
  }

  function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    localStorage.setItem('ekoyini_cart', JSON.stringify(cart));
    const btn = document.getElementById('btn-' + id);
    if (btn) { btn.textContent = cart[id]; btn.classList.add('added'); }
    updateBadges();
    showToast('✅ Added to cart');
  }

  function updateBadges() {
    const count = Object.values(cart).reduce((a, b) => a + b, 0);
    document.getElementById('navCartCount').textContent = count;
    const bn = document.getElementById('bnavCartCount');
    bn.textContent = count;
    bn.style.display = count > 0 ? 'flex' : 'none';
  }

  function openModal(id, name) {
    editingId = id;
    const p = products.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modalTitle').textContent = `Edit price: ${p.name}`;
    document.getElementById('modalInput').value = p.retailSingleZAR;
    document.getElementById('priceModal').classList.add('open');
  }

  function savePrice() {
    const val = parseFloat(document.getElementById('modalInput').value);
    if (!isNaN(val) && val >= 0) {
      const p = products.find(x => x.id === editingId);
      if (p) {
        p.retailSingleZAR = val;
        const el = document.querySelector('#card-' + editingId + ' .product-price');
        if (el) el.textContent = fmtPrice(val);
      }
    }
    closeModal();
  }

  function closeModal() { document.getElementById('priceModal').classList.remove('open'); }

  function saveAddress() {
    const v = document.getElementById('shopAddress').value.trim();
    if (v) localStorage.setItem('ekoyini_address', v);
  }

  function showToast(msg) {
    const t = document.getElementById('toastEl');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  // Init
  const addr = localStorage.getItem('ekoyini_address');
  if (addr) document.getElementById('shopAddress').value = addr;
  loadCatalog();
  </script>
</body>
</html>
