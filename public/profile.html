<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/favicon-180.png">
  <title>Ekoyini — Profile</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); margin: 12px; padding: 20px; text-align: center; }
    .profile-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--gold-deep); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; margin: 0 auto 12px; }
    .profile-email { font-size: 14px; font-weight: 700; color: var(--white); margin-bottom: 4px; word-break: break-all; }
    .profile-since { font-size: 11px; color: var(--muted); }
    .profile-links { display: flex; justify-content: center; gap: 16px; margin-top: 14px; font-size: 12px; }
    .profile-links a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
    .logout-btn { background: var(--surface); border: 1px solid var(--border); color: var(--danger); padding: 10px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; margin-top: 16px; }
    .order-list { padding: 0 12px; }
    .order-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px; margin-bottom: 10px; }
    .order-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .order-card-code { font-family: monospace; font-weight: 700; color: var(--green-light); font-size: 13px; }
    .order-card-status { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px; text-transform: uppercase; background: var(--surface); color: var(--muted); }
    .order-card-status.DELIVERED { background: var(--green-glow); color: var(--green-light); }
    .order-card-status.DISPATCHED { background: rgba(201,106,46,0.15); color: var(--terra-light); }
    .order-card-status.CANCELLED { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
    .order-card-meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .order-card-total { font-size: 13px; font-weight: 700; color: var(--white); margin-top: 6px; }
    .order-card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; }
    .order-card-actions { display: flex; gap: 8px; }
    .reorder-btn { background: var(--terra-light); color: #fff; border: none; padding: 7px 14px; border-radius: 8px; font-size: 11px; font-weight: 700; }
    .cancel-order-btn { background: transparent; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); padding: 7px 14px; border-radius: 8px; font-size: 11px; font-weight: 700; }
    .cancel-order-btn:disabled { opacity: .5; }
    .remove-order-btn { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 7px 14px; border-radius: 8px; font-size: 11px; font-weight: 700; }
    .remove-order-btn:disabled { opacity: .5; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
    .logged-out { text-align: center; padding: 60px 20px; }
    /* In-page confirm sheet (replaces window.confirm, which looks broken on mobile) */
    .confirm-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 200; }
    .confirm-backdrop.show { display: flex; }
    .confirm-sheet { background: var(--card); width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); }
    .confirm-sheet h3 { color: var(--white); font-size: 18px; margin-bottom: 8px; }
    .confirm-sheet p { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    .confirm-actions { display: flex; gap: 10px; }
    .confirm-actions button { flex: 1; min-height: 48px; border-radius: 999px; font-weight: 700; font-size: 14px; border: 1px solid var(--border); }
    .confirm-keep { background: var(--surface); color: var(--white); }
    .confirm-go { background: var(--danger); color: #fff; border-color: var(--danger) !important; }
  </style>
  <link rel="stylesheet" href="premium.css">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="back-arrow" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="logo">
      <img src="images/brand/ekoyini-icon.png" alt="Ekoyini">
      <div class="logo-text">Ekoyini</div>
    </div>
    <div style="width: 38px;"></div>
  </nav>

  <!-- PAGE -->
  <div class="page" id="profilePage"></div>

  <!-- CONFIRMATION (cancel an order / remove a finished order) -->
  <div class="confirm-backdrop" id="confirmBackdrop" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-sheet">
      <h3 id="confirmTitle">Cancel this order?</h3>
      <p id="confirmText">Your order will be cancelled and won't be delivered.</p>
      <div class="confirm-actions">
        <button type="button" class="confirm-keep" id="confirmKeep">Keep order</button>
        <button type="button" class="confirm-go" id="confirmGo">Yes, cancel</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="index.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="shop.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Shop
    </a>
    <a href="cart.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Cart
    </a>
    <a href="track.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Track
    </a>
    <a href="profile.html" class="bnav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <div class="toast" id="toastEl"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
  const fmtDate = (d) => new Date(d).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' });

  // Everything rendered via innerHTML goes through this — order fields
  // originate from customer input and must never be treated as markup.
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const STATUS_LABELS = {
    PAYMENT_PENDING: 'Awaiting payment',
    PENDING: 'Packing',
    DISPATCHED: 'On the way',
    DELIVERED: 'Delivered',
    CANCELLED: 'Cancelled',
  };
  // Mirrors the server rule in POST /order/:code/cancel — customers can
  // cancel until a driver has picked the order up.
  const CUSTOMER_CANCELLABLE = new Set(['PAYMENT_PENDING', 'PENDING']);
  // Mirrors POST /order/:code/hide — only finished orders can be removed
  // from the customer's own list (admin records are never affected).
  const CUSTOMER_REMOVABLE = new Set(['CANCELLED', 'DELIVERED']);

  async function init() {
    const session = await getSession();
    const page = document.getElementById('profilePage');

    if (!session) {
      page.innerHTML = `
        <div class="logged-out">
          <div style="margin-bottom:12px;color:var(--muted);opacity:0.4;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="40" height="40">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <h3 style="color:var(--white);margin-bottom:8px;">You're not logged in</h3>
          <p style="color:var(--muted);margin-bottom:20px;font-size:13px;">Log in to view your order history.</p>
          <a href="login.html?redirect=profile.html" class="cta-btn" style="display:inline-flex;align-items:center;justify-content:center;padding:0 32px;">Log In</a>
        </div>`;
      return;
    }

    const email = session.user.email || '';
    page.innerHTML = `
      <div class="profile-card">
        <div class="profile-avatar">${escapeHtml(email[0] ? email[0].toUpperCase() : '?')}</div>
        <div class="profile-email">${escapeHtml(email)}</div>
        <div class="profile-since">Member since ${fmtDate(session.user.created_at)}</div>
        <button class="logout-btn" id="logoutBtn">Log Out</button>
        <div class="profile-links"><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a></div>
      </div>
      <div class="section-header"><h2>Your Orders</h2></div>
      <div class="order-list" id="orderList"><div class="empty-state">Loading orders…</div></div>
    `;
    document.getElementById('logoutBtn').onclick = async () => { await signOut(); showToast('Logged out'); };
    loadOrders();
  }

  let myOrders = [];

  function renderOrderCard(o) {
    const code = escapeHtml(o.code);
    const canCancel = CUSTOMER_CANCELLABLE.has(o.status);
    const canRemove = CUSTOMER_REMOVABLE.has(o.status);
    const itemCount = o.items.length;
    return `
      <div class="order-card">
        <a href="track.html?code=${encodeURIComponent(o.code)}" style="display:block;color:inherit;text-decoration:none;">
          <div class="order-card-top">
            <span class="order-card-code">${code}</span>
            <span class="order-card-status ${escapeHtml(o.status)}">${escapeHtml(STATUS_LABELS[o.status] || o.status)}</span>
          </div>
          <div class="order-card-meta">${fmtDate(o.createdAt)} · ${itemCount} item${itemCount !== 1 ? 's' : ''}</div>
        </a>
        <div class="order-card-bottom">
          <div class="order-card-total">R${Number(o.total).toFixed(2)}</div>
          <div class="order-card-actions">
            ${canCancel ? `<button class="cancel-order-btn" data-cancel="${code}">Cancel</button>` : ''}
            ${canRemove ? `<button class="remove-order-btn" data-remove="${code}">Remove</button>` : ''}
            <button class="reorder-btn" data-reorder="${code}">Reorder</button>
          </div>
        </div>
      </div>`;
  }

  async function loadOrders() {
    const list = document.getElementById('orderList');
    if (!list) return;
    try {
      const res = await authedFetch('/api/my-orders');
      if (!res.ok) throw new Error('Failed to load orders');
      myOrders = await res.json();
      if (myOrders.length === 0) {
        list.innerHTML = `<div class="empty-state">No orders yet — your first Ekoyini order will show up here.<br><br><a href="shop.html" class="cta-btn" style="display:inline-flex;align-items:center;justify-content:center;padding:0 28px;">Start shopping</a></div>`;
        return;
      }
      list.innerHTML = myOrders.map(renderOrderCard).join('');
      // Delegated handlers instead of inline onclick with interpolated codes.
      list.querySelectorAll('[data-reorder]').forEach((b) => { b.onclick = () => reorder(b.dataset.reorder); });
      list.querySelectorAll('[data-cancel]').forEach((b) => { b.onclick = () => askCancel(b.dataset.cancel, b); });
      list.querySelectorAll('[data-remove]').forEach((b) => { b.onclick = () => askRemove(b.dataset.remove, b); });
    } catch (err) {
      console.error(err);
      list.innerHTML = '<div class="empty-state">Failed to load orders. Pull down to refresh or try again later.</div>';
    }
  }

  // ── Confirm sheet — shared by "cancel" and "remove" ──
  const backdrop = document.getElementById('confirmBackdrop');
  // { type: 'cancel' | 'remove', code, btn } while the sheet is open.
  let pendingAction = null;

  function openConfirm({ type, code, btn, title, text, keepLabel, goLabel }) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmText').textContent = text;
    document.getElementById('confirmKeep').textContent = keepLabel;
    document.getElementById('confirmGo').textContent = goLabel;
    pendingAction = { type, code, btn };
    backdrop.classList.add('show');
  }

  function askCancel(code, btn) {
    const order = myOrders.find((o) => o.code === code);
    const paidByCard = order && order.paymentMethod === 'card';
    openConfirm({
      type: 'cancel', code, btn,
      title: 'Cancel this order?',
      text: paidByCard
        ? `Order ${code} will be cancelled and your card payment refunded. Refunds can take a few working days.`
        : `Order ${code} will be cancelled and won't be delivered.`,
      keepLabel: 'Keep order',
      goLabel: 'Yes, cancel',
    });
  }

  function askRemove(code, btn) {
    openConfirm({
      type: 'remove', code, btn,
      title: 'Remove this order?',
      text: `Order ${code} will be removed from your order list. Ekoyini keeps its own record of the order.`,
      keepLabel: 'Keep it',
      goLabel: 'Yes, remove',
    });
  }

  function closeConfirm() { backdrop.classList.remove('show'); pendingAction = null; }
  document.getElementById('confirmKeep').onclick = closeConfirm;
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeConfirm(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeConfirm(); });

  // Runs one confirmed action against the server and reports the result.
  async function runOrderAction({ path, busyLabel, idleLabel, doneMessage, failMessage, btn }) {
    btn.disabled = true;
    btn.textContent = busyLabel;
    try {
      const res = await authedFetch(path, { method: 'POST' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || failMessage);
      showToast(doneMessage);
      loadOrders();
    } catch (err) {
      showToast(err.message);
      btn.disabled = false;
      btn.textContent = idleLabel;
    }
  }

  document.getElementById('confirmGo').onclick = () => {
    if (!pendingAction) return;
    const { type, code, btn } = pendingAction;
    closeConfirm();
    const base = `/order/${encodeURIComponent(code)}`;
    if (type === 'remove') {
      runOrderAction({ path: `${base}/hide`, busyLabel: 'Removing…', idleLabel: 'Remove', doneMessage: 'Order removed', failMessage: 'Could not remove this order', btn });
    } else {
      runOrderAction({ path: `${base}/cancel`, busyLabel: 'Cancelling…', idleLabel: 'Cancel', doneMessage: 'Order cancelled', failMessage: 'Could not cancel this order', btn });
    }
  };

  // "Buy Again" — merges a past order's items into the current cart.
  function reorder(code) {
    const order = myOrders.find((o) => o.code === code);
    if (!order) return;
    const cart = EkoyiniCart.get();
    let added = 0;
    order.items.forEach((item) => {
      if (!item.skuId) return;
      cart[item.skuId] = (cart[item.skuId] || 0) + item.quantity;
      added += item.quantity;
    });
    if (added === 0) {
      showToast('Those items are no longer available');
      return;
    }
    EkoyiniCart.save(cart);
    showToast('Added to cart');
    setTimeout(() => { window.location.href = 'cart.html'; }, 800);
  }

  window.addEventListener('ekoyini:auth-changed', init);
  init();
  </script>
</body>
</html>
