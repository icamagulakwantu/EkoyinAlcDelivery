<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ekoyini — Cart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .cart-empty { text-align: center; padding: 60px 20px; }
    .cart-empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
    .promo-code-row { display: flex; gap: 8px; padding: 0 12px 12px; }
    .promo-code-row input { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 10px; border-radius: 8px; color: var(--white); font-size: 13px; }
    .promo-code-row button { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 10px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .purchase-options { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .purchase-type-btn { background: var(--card); border: 1px solid var(--border); color: var(--white); padding: 12px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .purchase-type-btn.selected { background: var(--green); border-color: var(--green-mid); }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="shop.html" class="back-arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="logo">
      <div class="logo-text">Ekoyini</div>
    </div>
    <div id="navAuthSlot"></div>
  </nav>

  <!-- ADDRESS -->
  <div class="address-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
    </svg>
    <input type="text" id="cartAddress" placeholder="Delivery address" readonly>
    <button class="addr-save" onclick="editAddress()">Edit</button>
  </div>

  <!-- PURCHASE TYPE SELECTOR -->
  <div class="purchase-options">
    <div style="font-size: 12px; color: var(--muted); padding: 0 4px;">Order as:</div>
    <button class="purchase-type-btn selected" data-type="single" onclick="setPurchaseType('single')">🍾 Individual Bottles</button>
    <button class="purchase-type-btn" data-type="case" onclick="setPurchaseType('case')">📦 Cases (Get Discount)</button>
  </div>

  <!-- CART ITEMS -->
  <div class="page" id="cartPage"></div>

  <!-- PROMO CODE -->
  <div class="promo-code-row">
    <input type="text" id="promoInput" placeholder="Promo code">
    <button onclick="applyPromo()">Apply</button>
  </div>

  <!-- SUMMARY -->
  <div class="order-summary" id="summary"></div>

  <!-- CHECKOUT BUTTON -->
  <button class="cta-btn" onclick="goToCheckout()" style="margin-bottom: 20px;">🛒 Proceed to Checkout</button>

  <!-- TOAST -->
  <div class="toast" id="toastEl"></div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="index.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="shop.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Shop
    </a>
    <a href="cart.html" class="bnav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Cart
    </a>
    <a href="track.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Track
    </a>
    <a href="profile.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
  renderNavAuth();

  let cart = EkoyiniCart.get();
  let products = [];
  let purchaseType = 'single'; // 'single' or 'case'

  async function loadCart() {
    try {
      const res = await fetch('/api/products');
      products = await res.json();
      renderCart();
      renderSummary();
    } catch (err) {
      console.error('Failed to load products:', err);
      showToast('❌ Failed to load products');
    }
  }

  function renderCart() {
    const page = document.getElementById('cartPage');
    const items = Object.entries(cart);

    if (items.length === 0) {
      page.innerHTML = `
        <div class="cart-empty">
          <div class="cart-empty-icon">🛒</div>
          <h3 style="color: var(--white); margin-bottom: 8px;">Your cart is empty</h3>
          <p style="color: var(--muted); margin-bottom: 20px;">Start adding drinks to your cart</p>
          <a href="shop.html" class="cta-btn">Browse Products</a>
        </div>`;
      return;
    }

    page.innerHTML = '';

    items.forEach(([skuId, qty]) => {
      const p = products.find(x => x.id === skuId);
      if (!p) return;

      const unitPrice = purchaseType === 'case' ? (p.retailCaseZAR / p.unitsPerCase) : p.retailSingleZAR;
      const itemTotal = unitPrice * qty;

      const card = document.createElement('div');
      card.className = 'cart-item';
      card.innerHTML = `
        <div class="cart-item-img">${p.category.includes('BEER') || p.category.includes('CIDER') ? '🍾' : '🥃'}</div>
        <div class="cart-item-info">
          <h3>${p.name}</h3>
          <div class="ci-size">${p.bottleFormat}</div>
        </div>
        <div class="cart-item-right">
          <div class="cart-item-price">R${itemTotal.toFixed(2)}</div>
          <div class="qty-control">
            <button class="qty-btn" onclick="updateQty('${skuId}', -1)">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" onclick="updateQty('${skuId}', 1)">+</button>
          </div>
        </div>
      `;
      page.appendChild(card);
    });
  }

  function renderSummary() {
    const summary = document.getElementById('summary');
    const items = Object.entries(cart);
    let subtotal = 0;

    items.forEach(([skuId, qty]) => {
      const p = products.find(x => x.id === skuId);
      if (!p) return;
      const unitPrice = purchaseType === 'case' ? (p.retailCaseZAR / p.unitsPerCase) : p.retailSingleZAR;
      subtotal += unitPrice * qty;
    });

    const delivery = subtotal > 200 ? 0 : 50;
    const total = subtotal + delivery;

    summary.innerHTML = `
      <div class="summary-row">
        <span>Subtotal</span>
        <span>R${subtotal.toFixed(2)}</span>
      </div>
      <div class="summary-row">
        <span>Delivery <span style="font-size: 10px; color: var(--muted);">(free over R200)</span></span>
        <span>R${delivery.toFixed(2)}</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span class="amount">R${total.toFixed(2)}</span>
      </div>
      <div style="font-size:10px;color:var(--muted);padding-top:6px;">Cooler Box tier discounts (if eligible) are applied at checkout.</div>`;
  }

  function setPurchaseType(type) {
    purchaseType = type;
    document.querySelectorAll('.purchase-type-btn').forEach(b => b.classList.remove('selected'));
    document.querySelector(`[data-type="${type}"]`).classList.add('selected');
    renderCart();
    renderSummary();
  }

  function updateQty(skuId, delta) {
    const newQty = (cart[skuId] || 0) + delta;
    if (newQty <= 0) {
      delete cart[skuId];
    } else {
      cart[skuId] = newQty;
    }
    EkoyiniCart.save(cart);
    renderCart();
    renderSummary();
  }

  function applyPromo() {
    const code = document.getElementById('promoInput').value.trim().toUpperCase();
    if (!code) return;
    // No real promo-code data model yet — see README "Known Gaps".
    showToast('ℹ️ Promo codes are coming soon');
  }

  function editAddress() {
    const addr = prompt('Enter your delivery address:', EkoyiniAddress.get());
    if (addr) {
      EkoyiniAddress.save(addr);
      document.getElementById('cartAddress').value = addr;
    }
  }

  function goToCheckout() {
    const addr = EkoyiniAddress.get();
    if (!addr) {
      showToast('❌ Please enter a delivery address');
      editAddress();
      return;
    }
    if (Object.keys(cart).length === 0) {
      showToast('❌ Your cart is empty');
      return;
    }
    localStorage.setItem('ekoyini_checkout_data', JSON.stringify({ cart, purchaseType, address: addr }));
    window.location.href = 'checkout.html';
  }

  // Live re-render on cart changes from another tab (or this one).
  window.addEventListener('ekoyini:cart-updated', () => { cart = EkoyiniCart.get(); renderCart(); renderSummary(); });

  // Init
  document.getElementById('cartAddress').value = EkoyiniAddress.get();
  loadCart();
  </script>
</body>
</html>
