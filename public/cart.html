<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ekoyini — Cart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .cart-empty { text-align: center; padding: 60px 20px; }
    .cart-empty-icon { display: flex; justify-content: center; margin-bottom: 16px; opacity: 0.3; color: var(--muted); }
    .promo-code-row { display: flex; gap: 8px; padding: 0 12px 12px; }
    .promo-code-row input { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 10px; border-radius: 8px; color: var(--white); font-size: 13px; }
    .promo-code-row button { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 10px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .promo-applied { display: flex; align-items: center; justify-content: space-between; margin: -4px 12px 12px; padding: 8px 12px; background: var(--green-glow); color: var(--green-light); border-radius: 8px; font-size: 12px; font-weight: 600; }
    .promo-applied button { background: none; border: none; color: inherit; font-size: 16px; line-height: 1; cursor: pointer; padding: 0 2px; }
    .purchase-options { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .purchase-type-btn { background: var(--card); border: 1px solid var(--border); color: var(--white); padding: 12px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .purchase-type-btn.selected { background: var(--terra-light); border-color: var(--terra); }
    /* Explicit remove — set apart from the qty stepper (margin, muted
       color) so it doesn't read as a third step of the same control. */
    .remove-btn { margin-left: 4px; color: var(--muted); border-color: transparent; background: transparent; }
    .remove-btn:hover { color: var(--danger); border-color: var(--danger); background: rgba(214, 54, 42, 0.08); }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="shop.html" class="back-arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="logo">
      <div class="logo-text">Ekoyini</div>
    </div>
    <div id="navAuthSlot"></div>
  </nav>

  <!-- ADDRESS -->
  <div class="address-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
    </svg>
    <input type="text" id="cartAddress" placeholder="Delivery address" readonly>
    <button class="addr-save" onclick="editAddress()">Edit</button>
  </div>

  <!-- PURCHASE TYPE SELECTOR -->
  <div class="purchase-options">
    <div style="font-size: 12px; color: var(--muted); padding: 0 4px;">Order as:</div>
    <button class="purchase-type-btn selected" data-type="single" onclick="setPurchaseType('single')">Individual Bottles</button>
    <button class="purchase-type-btn" data-type="case" onclick="setPurchaseType('case')">Cases (Get Discount)</button>
  </div>

  <div class="page">
    <!-- CART ITEMS -->
    <div id="cartPage"></div>

    <!-- PROMO CODE -->
    <div class="promo-code-row" id="promoRow">
      <input type="text" id="promoInput" placeholder="Promo code">
      <button onclick="applyPromo()" id="promoApplyBtn">Apply</button>
    </div>
    <div class="promo-applied" id="promoApplied" style="display:none;"></div>

    <!-- SUMMARY -->
    <div class="order-summary" id="summary"></div>

    <!-- CHECKOUT BUTTON -->
    <button class="cta-btn" onclick="goToCheckout()" style="margin-bottom: 20px;">Proceed to Checkout</button>
  </div><!-- /page -->

  <!-- TOAST -->
  <div class="toast" id="toastEl"></div>

  <!-- ADDRESS EDIT MODAL -->
  <div class="modal-overlay" id="addressModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h3>Delivery Address</h3>
      <input type="text" id="addressModalInput" placeholder="Enter your delivery address">
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeAddressModal()">Cancel</button>
        <button class="btn-save" onclick="saveAddressModal()">Save</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="index.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="shop.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Shop
    </a>
    <a href="cart.html" class="bnav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Cart
    </a>
    <a href="track.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Track
    </a>
    <a href="profile.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
  renderNavAuth();

  let cart = EkoyiniCart.get();
  let products = [];
  let purchaseType = 'single'; // 'single' or 'case'
  let appliedPromo = null; // { code, discountPct } once validated

  function computeSubtotal() {
    let subtotal = 0;
    Object.entries(cart).forEach(([skuId, qty]) => {
      const p = products.find(x => x.id === skuId);
      if (!p) return;
      const unitPrice = purchaseType === 'case' ? (p.retailCaseZAR / p.unitsPerCase) : p.retailSingleZAR;
      subtotal += unitPrice * qty;
    });
    return subtotal;
  }

  async function loadCart() {
    try {
      const res = await fetch('/api/products');
      products = await res.json();
      renderCart();

      const savedCode = localStorage.getItem('ekoyini_promo_code');
      if (savedCode) {
        const r = await fetch('/api/promo/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: savedCode, subtotal: computeSubtotal() }),
        });
        const data = await r.json();
        if (data.valid) {
          appliedPromo = { code: data.code, discountPct: data.discountPct };
          document.getElementById('promoRow').style.display = 'none';
          document.getElementById('promoApplied').style.display = 'flex';
          document.getElementById('promoApplied').innerHTML = `<span>${data.code} applied — ${data.discountPct}% off</span><button onclick="removePromo()">&times;</button>`;
        } else {
          localStorage.removeItem('ekoyini_promo_code');
        }
      }

      renderSummary();
    } catch (err) {
      console.error('Failed to load products:', err);
      showToast('Failed to load products');
    }
  }

  function renderCart() {
    const page = document.getElementById('cartPage');
    const items = Object.entries(cart);

    if (items.length === 0) {
      page.innerHTML = `
        <div class="cart-empty">
          <div class="cart-empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="48" height="48">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
          </div>
          <h3 style="color: var(--white); margin-bottom: 8px;">Your cart is empty</h3>
          <p style="color: var(--muted); margin-bottom: 20px;">Start adding drinks to your cart</p>
          <a href="shop.html" class="cta-btn">Browse Products</a>
        </div>`;
      return;
    }

    page.innerHTML = '';

    items.forEach(([skuId, qty]) => {
      const p = products.find(x => x.id === skuId);
      if (!p) return;

      const unitPrice = purchaseType === 'case' ? (p.retailCaseZAR / p.unitsPerCase) : p.retailSingleZAR;
      const itemTotal = unitPrice * qty;

      const card = document.createElement('div');
      card.className = 'cart-item';
      card.innerHTML = `
        <div class="cart-item-img">${p.name[0].toUpperCase()}</div>
        <div class="cart-item-info">
          <h3>${p.name}</h3>
          <div class="ci-size">${p.bottleFormat}</div>
        </div>
        <div class="cart-item-right">
          <div class="cart-item-price">R${itemTotal.toFixed(2)}</div>
          <div class="qty-control">
            <button class="qty-btn" onclick="updateQty('${skuId}', -1)">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" onclick="updateQty('${skuId}', 1)">+</button>
            <button class="qty-btn remove-btn" onclick="removeItem('${skuId}')" aria-label="Remove ${p.name.replace(/"/g, '&quot;')} from cart">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </div>
      `;
      page.appendChild(card);
    });
  }

  function renderSummary() {
    const summary = document.getElementById('summary');
    const subtotal = computeSubtotal();
    const promoDiscount = appliedPromo ? subtotal * (appliedPromo.discountPct / 100) : 0;
    const delivery = subtotal > 200 ? 0 : 50;
    const total = subtotal - promoDiscount + delivery;

    summary.innerHTML = `
      <div class="summary-row">
        <span>Subtotal</span>
        <span>R${subtotal.toFixed(2)}</span>
      </div>
      ${appliedPromo ? `<div class="summary-row"><span>Promo (${appliedPromo.code})</span><span>-R${promoDiscount.toFixed(2)}</span></div>` : ''}
      <div class="summary-row">
        <span>Delivery <span style="font-size: 10px; color: var(--muted);">(free over R200)</span></span>
        <span>R${delivery.toFixed(2)}</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span class="amount">R${total.toFixed(2)}</span>
      </div>
      <div style="font-size:10px;color:var(--muted);padding-top:6px;">Estimated — Cooler Box and promo discounts are finalized at checkout.</div>`;
  }

  function setPurchaseType(type) {
    purchaseType = type;
    document.querySelectorAll('.purchase-type-btn').forEach(b => b.classList.remove('selected'));
    document.querySelector(`[data-type="${type}"]`).classList.add('selected');
    renderCart();
    renderSummary();
  }

  function updateQty(skuId, delta) {
    const newQty = (cart[skuId] || 0) + delta;
    if (newQty <= 0) {
      delete cart[skuId];
    } else {
      cart[skuId] = newQty;
    }
    EkoyiniCart.save(cart);
    renderCart();
    renderSummary();
  }

  // Explicit remove, regardless of quantity — distinct from "−" to 0,
  // since that requires as many taps as the quantity itself.
  function removeItem(skuId) {
    delete cart[skuId];
    EkoyiniCart.save(cart);
    renderCart();
    renderSummary();
  }
  window.removeItem = removeItem;

  async function applyPromo() {
    const code = document.getElementById('promoInput').value.trim().toUpperCase();
    if (!code) return;
    const btn = document.getElementById('promoApplyBtn');
    btn.disabled = true;
    btn.textContent = 'Checking…';
    try {
      const res = await fetch('/api/promo/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, subtotal: computeSubtotal() }),
      });
      const data = await res.json();
      if (!data.valid) {
        showToast(data.error || 'Invalid promo code');
        return;
      }
      appliedPromo = { code: data.code, discountPct: data.discountPct };
      localStorage.setItem('ekoyini_promo_code', data.code);
      document.getElementById('promoRow').style.display = 'none';
      document.getElementById('promoApplied').style.display = 'flex';
      document.getElementById('promoApplied').innerHTML = `<span>${data.code} applied — ${data.discountPct}% off</span><button onclick="removePromo()">&times;</button>`;
      renderSummary();
      showToast(`${data.discountPct}% off applied`);
    } catch (err) {
      console.error(err);
      showToast('Failed to check promo code');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Apply';
    }
  }

  function removePromo() {
    appliedPromo = null;
    localStorage.removeItem('ekoyini_promo_code');
    document.getElementById('promoInput').value = '';
    document.getElementById('promoRow').style.display = 'flex';
    document.getElementById('promoApplied').style.display = 'none';
    renderSummary();
  }
  window.removePromo = removePromo;

  function editAddress() {
    document.getElementById('addressModalInput').value = EkoyiniAddress.get();
    document.getElementById('addressModal').classList.add('open');
  }

  function closeAddressModal() {
    document.getElementById('addressModal').classList.remove('open');
  }

  function saveAddressModal() {
    const addr = document.getElementById('addressModalInput').value.trim();
    if (!addr) { showToast('Please enter an address'); return; }
    EkoyiniAddress.save(addr);
    document.getElementById('cartAddress').value = addr;
    closeAddressModal();
  }
  window.closeAddressModal = closeAddressModal;
  window.saveAddressModal = saveAddressModal;

  function goToCheckout() {
    const addr = EkoyiniAddress.get();
    if (!addr) {
      showToast('Please enter a delivery address');
      editAddress();
      return;
    }
    if (Object.keys(cart).length === 0) {
      showToast('Your cart is empty');
      return;
    }
    localStorage.setItem('ekoyini_checkout_data', JSON.stringify({ cart, purchaseType, address: addr }));
    window.location.href = 'checkout.html';
  }

  // Live re-render on cart changes from another tab (or this one).
  window.addEventListener('ekoyini:cart-updated', () => { cart = EkoyiniCart.get(); renderCart(); renderSummary(); });

  // Init
  document.getElementById('cartAddress').value = EkoyiniAddress.get();
  if (requireAgeGate()) loadCart();
  </script>
</body>
</html>
