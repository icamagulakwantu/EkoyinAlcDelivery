<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ekoyini — Reset Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-logo">Ekoyini</div>
    <div class="auth-sub" id="pageSub">Enter your email and we'll send you a link to reset your password.</div>

    <div class="auth-error" id="authError"></div>

    <form id="resetForm">
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <button type="submit" class="cta-btn" id="submitBtn">Send Reset Link</button>
    </form>

    <div class="auth-switch">Remembered it? <a href="login.html">Log in</a></div>
  </div>

  <div class="toast" id="toastEl"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('authError');
    errEl.classList.remove('show');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
      await resetPassword(document.getElementById('email').value.trim());
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('pageSub').textContent = "Check your email for a link to reset your password. It can take a minute to arrive — check spam too.";
    } catch (err) {
      errEl.textContent = err.message || 'Something went wrong. Please try again.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
    }
  });
  </script>
</body>
</html>
