<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ekoyini — Set New Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-logo">Ekoyini</div>
    <div class="auth-sub" id="pageSub">Choose a new password for your account.</div>

    <div class="auth-error" id="authError"></div>

    <form id="updateForm">
      <div class="auth-field">
        <label>New Password</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="6" placeholder="At least 6 characters">
      </div>
      <button type="submit" class="cta-btn" id="submitBtn">Set New Password</button>
    </form>
  </div>

  <div class="toast" id="toastEl"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
  // The reset-link Supabase emails carries a recovery token in the URL
  // fragment. The SDK exchanges it for a temporary session automatically
  // and fires PASSWORD_RECOVERY on load — until that fires (or an existing
  // session is already present), there's nothing valid to update yet.
  let recoveryReady = false;
  ekoyiniAuth.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') recoveryReady = true;
  });
  getSession().then((session) => { if (session) recoveryReady = true; });

  document.getElementById('updateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('authError');
    errEl.classList.remove('show');

    if (!recoveryReady) {
      errEl.textContent = 'This reset link is invalid or has expired. Request a new one from the login page.';
      errEl.classList.add('show');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      await updatePassword(document.getElementById('password').value);
      document.getElementById('updateForm').style.display = 'none';
      document.getElementById('pageSub').textContent = 'Password updated. Redirecting you to log in…';
      await signOut();
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    } catch (err) {
      errEl.textContent = err.message || 'Could not update your password. Please try again.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Set New Password';
    }
  });
  </script>
</body>
</html>
