<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/favicon-180.png">
  <title>Ekoyini — Share Delivery Location</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dt-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; }
    .dt-card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 28px 22px; box-shadow: 0 10px 28px rgba(23,20,14,.08); }
    .dt-logo { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--gold-deep); margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .dt-logo img { height: 52px; width: 52px; object-fit: contain; border-radius: 12px; }
    .dt-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .dt-code { font-family: monospace; font-size: 20px; font-weight: 800; letter-spacing: .06em; color: var(--terra-light); margin-bottom: 12px; }
    .dt-status { font-size: 14px; color: var(--muted); margin-bottom: 22px; line-height: 1.5; }
    .dt-btn { width: 100%; min-height: 54px; background: var(--terra-light); color: #fff; border: none; border-radius: 999px; font-size: 16px; font-weight: 700; margin-bottom: 12px; box-shadow: 0 8px 20px -8px var(--terra-light); }
    .dt-btn:disabled { opacity: 0.5; }
    .dt-btn-secondary { background: var(--green-light); box-shadow: 0 8px 20px -8px var(--green-light); }
    .dt-sharing { display: none; align-items: center; justify-content: center; gap: 8px; background: var(--green-glow); color: var(--green-light); padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 700; margin-bottom: 14px; }
    .dt-sharing.active { display: flex; }
    .dt-pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: dtpulse 1.4s ease-in-out infinite; }
    @keyframes dtpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .dt-error { color: var(--terra); font-size: 13px; margin-top: 8px; line-height: 1.5; }
    .dt-done { color: var(--green-light); font-size: 16px; font-weight: 700; }
  </style>
  <link rel="stylesheet" href="premium.css">
</head>
<body>
  <div class="dt-page">
    <div class="dt-card">
      <div class="dt-logo"><img src="images/brand/ekoyini-icon.png" alt="Ekoyini"><span>Ekoyini Driver</span></div>
      <div id="dtBody">
        <div class="dt-label">Order</div>
        <div class="dt-code" id="dtCode">—</div>
        <p class="dt-status">Loading order…</p>
      </div>
    </div>
  </div>

  <script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const token = params.get('token');

  // The code comes from the URL, so it must never be inserted as markup.
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const codeHtml = `<div class="dt-label">Order</div><div class="dt-code">${escapeHtml(code || 'No order code')}</div>`;

  let watchId = null;
  let currentStatus = null;

  async function init() {
    if (!code || !token) {
      renderError('This link is missing its order code or token — ask dispatch to resend it.');
      return;
    }
    try {
      const res = await fetch(`/api/order/${encodeURIComponent(code)}/track`);
      if (!res.ok) { renderError('Order not found — check the link and try again.'); return; }
      const order = await res.json();
      currentStatus = order.status;
      render();
    } catch (err) {
      console.error(err);
      renderError('Couldn\'t load this order. Check your connection and try again.');
    }
  }

  function stopWatching() {
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  }

  function render() {
    const body = document.getElementById('dtBody');
    if (currentStatus === 'PENDING') {
      body.innerHTML = `${codeHtml}
        <p class="dt-status">This order is packed and ready. Tap below once you've collected it from the tavern.</p>
        <button class="dt-btn" id="dtPickupBtn">Confirm Pickup</button>
        <div class="dt-error" id="dtError"></div>`;
      document.getElementById('dtPickupBtn').onclick = confirmPickup;
    } else if (currentStatus === 'DISPATCHED') {
      body.innerHTML = `${codeHtml}
        <p class="dt-status">Share your live location with the customer while you're on your way. Remember to check ID (18+) at the door.</p>
        <button class="dt-btn" id="dtStartBtn">Start Sharing My Location</button>
        <div class="dt-sharing" id="dtSharing"><span class="dt-pulse"></span> Sharing live location</div>
        <button class="dt-btn dt-btn-secondary" id="dtDeliveredBtn">Mark as Delivered</button>
        <div class="dt-error" id="dtError"></div>`;
      document.getElementById('dtStartBtn').onclick = startSharing;
      document.getElementById('dtDeliveredBtn').onclick = confirmDelivered;
    } else if (currentStatus === 'DELIVERED') {
      stopWatching();
      body.innerHTML = `${codeHtml}<p class="dt-done">Delivered — thanks for driving with Ekoyini!</p>`;
    } else if (currentStatus === 'CANCELLED') {
      stopWatching();
      body.innerHTML = `${codeHtml}<p class="dt-status">This order has been cancelled. Please don't deliver it — contact dispatch if you've already collected it.</p>`;
    } else {
      body.innerHTML = `${codeHtml}<p class="dt-status">This order isn't ready for pickup yet.</p>`;
    }
  }

  function renderError(msg) {
    document.getElementById('dtBody').innerHTML = `${codeHtml}<div class="dt-error">${escapeHtml(msg)}</div>`;
  }

  async function postDriverAction(path, btn, idleLabel) {
    btn.disabled = true;
    btn.textContent = 'Confirming…';
    try {
      const res = await fetch(`/order/${encodeURIComponent(code)}/${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');
      currentStatus = data.status;
      render();
    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btn.textContent = idleLabel;
      document.getElementById('dtError').textContent = err.message;
    }
  }

  function confirmPickup() {
    postDriverAction('confirm-pickup', document.getElementById('dtPickupBtn'), 'Confirm Pickup');
  }
  function confirmDelivered() {
    postDriverAction('confirm-delivered', document.getElementById('dtDeliveredBtn'), 'Mark as Delivered');
  }

  function startSharing() {
    if (!navigator.geolocation) {
      document.getElementById('dtError').textContent = 'Your browser doesn\'t support location sharing.';
      return;
    }
    const startBtn = document.getElementById('dtStartBtn');
    startBtn.disabled = true;
    startBtn.textContent = 'Requesting location access…';

    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        startBtn.style.display = 'none';
        document.getElementById('dtSharing').classList.add('active');
        document.getElementById('dtError').textContent = '';
        postLocation(pos.coords.latitude, pos.coords.longitude);
      },
      (err) => {
        console.error(err);
        startBtn.disabled = false;
        startBtn.textContent = 'Start Sharing My Location';
        document.getElementById('dtError').textContent = err.code === 1 ? 'Location access was denied — enable it in your browser settings and try again.' : 'Couldn\'t get your location. Try again.';
      },
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
    );
  }

  let lastSent = 0;
  async function postLocation(lat, lng) {
    // Throttle to ~10s; the server's rate limit allows this comfortably.
    const now = Date.now();
    if (now - lastSent < 10000) return;
    lastSent = now;
    try {
      const res = await fetch(`/order/${encodeURIComponent(code)}/location`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, lat, lng }),
      });
      // Order was cancelled or delivered elsewhere — stop broadcasting.
      if (res.status === 400) { stopWatching(); init(); }
    } catch (err) {
      console.error('Failed to post location:', err);
    }
  }

  window.addEventListener('beforeunload', stopWatching);
  init();
  </script>
</body>
</html>
