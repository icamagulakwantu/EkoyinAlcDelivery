<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/favicon-180.png">
  <meta name="robots" content="noindex, nofollow">
  <title>Ekoyini — Your receipt</title>
  <style>
    body { margin: 0; background: #faf6ee; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #222; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 18px 14px 40px; }
    .card { background: #fff; border: 1px solid #e8dcc0; border-radius: 14px; padding: 22px; }
    .brand { font-family: Georgia, serif; font-weight: 700; font-size: 22px; color: #7a5c00; margin-bottom: 14px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 0; }
    .btn { border: 0; border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 700; background: #17140e; color: #fff; cursor: pointer; text-decoration: none; }
    .btn.alt { background: #fff; color: #17140e; border: 1px solid #17140e; }
    .msg { text-align: center; padding: 40px 10px; color: #666; }
    @media print { body { background: #fff; } .actions, .noprint { display: none !important; } .card { border: 0; padding: 0; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">Ekoyini</div>
      <div id="receiptBody" class="msg">Loading your receipt…</div>
    </div>
    <div class="actions noprint">
      <button class="btn" type="button" onclick="window.print()">Print or save as PDF</button>
      <a class="btn alt" id="backLink" href="track.html">Back to my order</a>
    </div>
  </div>
  <script src="/vendor/supabase-js-2.119.0.js"></script>
  <script src="auth.js"></script>
  <script src="receipt.js"></script>
  <script>
    (async function () {
      const code = new URLSearchParams(location.search).get('code') || '';
      const body = document.getElementById('receiptBody');
      if (code) document.getElementById('backLink').href = 'track.html?code=' + encodeURIComponent(code);
      if (!code) { body.textContent = 'No order code given.'; return; }
      // Only the customer who placed the order can open the receipt.
      const session = await requireAuth('receipt.html?code=' + encodeURIComponent(code));
      if (!session) return;
      try {
        const res = await authedFetch('/api/order/' + encodeURIComponent(code) + '/receipt');
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { body.textContent = res.status === 404 ? 'We could not find that order on your account.' : (data.error || 'Could not load the receipt.'); return; }
        body.className = '';
        body.innerHTML = EkoyiniReceipt.renderReceiptHtml(data.receipt);
      } catch (e) { body.textContent = 'Could not load the receipt. Please try again.'; }
    })();
  </script>
</body>
</html>
