<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/favicon-180.png">
  <title>Ekoyini — Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="premium.css">
  <link rel="stylesheet" href="app.css">

  <style>
    .optin-row { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 16px; font-size: 13px; color: var(--muted); line-height: 1.45; text-align: left; cursor: pointer; }
    .optin-row input { width: 18px; height: 18px; margin-top: 1px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="auth-page">
    <img src="images/brand/ekoyini-icon.png" alt="Ekoyini" class="auth-logo-img">
    <div class="auth-logo">Ekoyini</div>
    <div class="auth-sub">Create an account to order and track deliveries.</div>

    <div class="auth-error" id="authError"></div>

    <form id="signupForm">
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="6" placeholder="At least 6 characters">
      </div>
      <!-- POPIA: marketing only with consent, so this starts unticked. -->
      <label class="optin-row"><input type="checkbox" id="marketingOptIn"> <span>Send me Ekoyini specials and new arrivals on WhatsApp or email. Optional; switch it off any time in your profile.</span></label>
      <button type="submit" class="cta-btn" id="submitBtn">Sign Up</button>
    </form>

    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>

  <div class="toast" id="toastEl"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
  const params = new URLSearchParams(window.location.search);
  const redirect = params.get('redirect') || 'index.html';

  getSession().then((session) => { if (session) window.location.href = redirect; });

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('authError');
    errEl.classList.remove('show');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Creating account…';
    try {
      const wantsSpecials = document.getElementById('marketingOptIn').checked;
      const data = await signUp(document.getElementById('email').value.trim(), document.getElementById('password').value);
      if (wantsSpecials) {
        // Saved once the account is signed in (now, or after email confirmation).
        try { localStorage.setItem('ekoyini_pending_marketing', 'true'); } catch {}
        if (data.session) await applyPendingMarketingChoice();
      }
      if (data.session) {
        window.location.href = redirect;
      } else {
        showToast('Check your email to confirm your account');
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      }
    } catch (err) {
      errEl.textContent = err.message || 'Sign up failed. Please try again.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Sign Up';
    }
  });
  </script>
  <script src="/analytics.js" defer></script>
</body>
</html>
