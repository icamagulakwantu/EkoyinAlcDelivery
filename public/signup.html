<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ekoyini — Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-logo">Ekoyini</div>
    <div class="auth-sub">Create an account to order and track deliveries.</div>

    <div class="auth-error" id="authError"></div>

    <form id="signupForm">
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="6" placeholder="At least 6 characters">
      </div>
      <button type="submit" class="cta-btn" id="submitBtn">Sign Up</button>
    </form>

    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>

  <div class="toast" id="toastEl"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
  const params = new URLSearchParams(window.location.search);
  const redirect = params.get('redirect') || 'index.html';

  getSession().then((session) => { if (session) window.location.href = redirect; });

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('authError');
    errEl.classList.remove('show');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Creating account…';
    try {
      const data = await signUp(document.getElementById('email').value.trim(), document.getElementById('password').value);
      if (data.session) {
        window.location.href = redirect;
      } else {
        showToast('✅ Check your email to confirm your account');
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      }
    } catch (err) {
      errEl.textContent = err.message || 'Sign up failed. Please try again.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Sign Up';
    }
  });
  </script>
</body>
</html>
