<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/favicon-180.png">
  <title>Ekoyini — Track Order</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    .track-map { height: 220px; border-radius: var(--r-md); overflow: hidden; margin: 0 12px 16px; border: 1px solid var(--border); display: none; }
    .track-map.active { display: block; }
    .track-search { display: flex; gap: 8px; padding: 12px; }
    .track-search input { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 12px 14px; border-radius: var(--r-sm); color: var(--white); font-size: 14px; text-transform: uppercase; }
    .track-search input:focus { outline: none; border-color: var(--green-mid); }
    .track-search button { background: var(--terra-light); color: #fff; border: none; padding: 0 18px; border-radius: var(--r-sm); font-size: 13px; font-weight: 700; }
    .track-result { margin: 12px; }
    .track-result-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); padding: 18px; margin-bottom: 16px; }
    .track-result-code { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--green-light); margin-bottom: 4px; }
    .track-result-meta { font-size: 11px; color: var(--muted); }
    .track-driver { background: var(--surface); border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 12px; color: var(--muted); }
    .track-driver strong { color: var(--white); }
    .track-empty, .track-error { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
    .track-cancelled { border-radius: 20px; padding: 20px; text-align: center; background: color-mix(in srgb, var(--danger) 8%, var(--card)); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); }
    .track-cancelled h3 { color: var(--danger); font-size: 17px; margin-bottom: 6px; }
    .track-cancelled p { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .rating-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); padding: 18px; margin: 0 12px 16px; text-align: center; }
    .rating-label { font-size: 13px; font-weight: 700; color: var(--white); margin-bottom: 10px; }
    .rating-stars, .rating-stars-display { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
    .rating-star { background: none; border: none; padding: 2px; cursor: pointer; transition: transform 0.1s; }
    .rating-star:hover { transform: scale(1.15); }
    #ratingComment { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--white); font-size: 12px; resize: vertical; min-height: 50px; margin-bottom: 10px; font-family: inherit; }
    .rating-submit { background: var(--terra-light); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 700; }
    .rating-submit:disabled { opacity: 0.4; }
    .rating-comment-display { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 4px; }
    .track-autorefresh { text-align: center; font-size: 10px; color: var(--muted); margin: -8px 12px 12px; }
  </style>
  <link rel="stylesheet" href="premium.css">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="back-arrow" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="logo">
      <img src="images/brand/ekoyini-icon.png" alt="Ekoyini">
      <div class="logo-text">Ekoyini</div>
    </div>
    <div id="navAuthSlot"></div>
  </nav>

  <!-- PAGE -->
  <div class="page">
    <form class="track-search" onsubmit="event.preventDefault(); lookup();">
      <input type="text" id="codeInput" placeholder="EKO-XXXXXXXX" autocomplete="off" autocapitalize="characters" aria-label="Order code">
      <button type="submit">Track</button>
    </form>
    <div class="track-result" id="trackResult">
      <div class="track-empty">Enter your order code to see live status — no login required.</div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="index.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="shop.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Shop
    </a>
    <a href="cart.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Cart
    </a>
    <a href="track.html" class="bnav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Track
    </a>
    <a href="profile.html" class="bnav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <div class="toast" id="toastEl"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
  renderNavAuth();

  // Driver/tavern names and rating comments are free text — escape before
  // they ever touch innerHTML.
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function statusSteps(paymentMethod) {
    const isEft = paymentMethod === 'eft';
    return [
      { key: 'PAYMENT_PENDING', label: isEft ? 'Awaiting Payment' : 'Order Placed', desc: isEft ? 'We\'ve received your order — awaiting your EFT payment.' : 'We\'ve received your order.' },
      { key: 'PENDING', label: isEft ? 'Payment Received — Packing' : 'Confirmed — Packing', desc: isEft ? 'Payment received! Your order is being packed and a driver will collect it soon.' : 'Your order is confirmed and being packed — a driver will collect it soon.' },
      { key: 'DISPATCHED', label: 'On The Way', desc: 'Your driver has picked up your order and is heading your way.' },
      { key: 'DELIVERED', label: 'Delivered', desc: 'Enjoy! Thanks for ordering with Ekoyini.' },
    ];
  }
  const CANCELLED_DESC = 'This order was cancelled. If you paid by card, your refund is on its way.';
  const FINAL_STATUSES = new Set(['DELIVERED', 'CANCELLED']);

  function renderTimeline(status, paymentMethod) {
    const STATUS_STEPS = statusSteps(paymentMethod);
    const currentIdx = STATUS_STEPS.findIndex((s) => s.key === status);
    return STATUS_STEPS.map((s, i) => {
      const state = i < currentIdx ? 'done' : i === currentIdx ? 'done current' : '';
      const icon = i <= currentIdx ? '✓' : i + 1;
      return `
        <div class="track-step ${state}">
          <div class="track-step-dot">${icon}</div>
          <div>
            <div class="track-step-label">${s.label}</div>
            <div class="track-step-desc">${s.desc}</div>
          </div>
        </div>`;
    }).join('');
  }

  // Map is recreated on every render because #trackMap is replaced each poll.
  let leafletMap = null;

  function updateDriverMap(order) {
    if (leafletMap) { leafletMap.remove(); leafletMap = null; }
    const mapEl = document.getElementById('trackMap');
    if (!mapEl || order.driverLat == null || order.driverLng == null) {
      if (mapEl) mapEl.classList.remove('active');
      return;
    }
    mapEl.classList.add('active');
    const pos = [order.driverLat, order.driverLng];
    leafletMap = L.map('trackMap', { zoomControl: false, attributionControl: false }).setView(pos, 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(leafletMap);
    L.circleMarker(pos, { radius: 8, color: '#cc3700', fillColor: '#cc3700', fillOpacity: 0.9 }).addTo(leafletMap);
  }

  let pollTimer = null;
  let activeCode = null;

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  async function lookup() {
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (!code) { showToast('Enter an order code'); return; }
    stopPolling();
    activeCode = code;
    document.getElementById('trackResult').innerHTML = '<div class="track-empty">Looking up your order…</div>';
    await fetchAndRender(code);
  }

  function driverBlock(order) {
    if (!order.tavern) return '';
    const tavern = `<strong>${escapeHtml(order.tavern.name)}</strong> — picking up in ${escapeHtml(order.tavern.area)}`;
    const driver = order.driverName
      ? `<br><strong>${escapeHtml(order.driverName)}</strong>${order.driverVehicle ? ` (${escapeHtml(order.driverVehicle)})` : ''} is heading your way from ${escapeHtml(order.tavern.area)}`
      : '';
    return `<div class="track-driver">${tavern}${driver}</div>`;
  }

  async function fetchAndRender(code) {
    const result = document.getElementById('trackResult');
    try {
      const res = await fetch(`/api/order/${encodeURIComponent(code)}/track`);
      if (res.status === 404) {
        result.innerHTML = '<div class="track-error">No order found with that code. Double-check and try again.</div>';
        return;
      }
      if (res.status === 429) {
        result.innerHTML = '<div class="track-error">Too many lookups — please wait a few minutes and try again.</div>';
        stopPolling();
        return;
      }
      if (!res.ok) throw new Error('Lookup failed');
      const order = await res.json();
      const isCancelled = order.status === 'CANCELLED';

      // Surface status changes as a toast, not just a silent timeline update.
      const seenKey = `ekoyini_track_seen_${order.code}`;
      const lastSeen = localStorage.getItem(seenKey);
      if (lastSeen && lastSeen !== order.status) {
        const step = statusSteps(order.paymentMethod).find((s) => s.key === order.status);
        const msg = isCancelled ? CANCELLED_DESC : step && step.desc;
        if (msg) showToast(msg, 5000);
      }
      localStorage.setItem(seenKey, order.status);

      const itemCount = order.items.length;
      result.innerHTML = `
        <div class="track-result-card">
          <div class="track-result-code">${escapeHtml(order.code)}</div>
          <div class="track-result-meta">${itemCount} item${itemCount !== 1 ? 's' : ''} · placed ${new Date(order.createdAt).toLocaleString('en-ZA')}</div>
          ${isCancelled ? '' : driverBlock(order)}
        </div>
        ${isCancelled
          ? `<div class="track-cancelled"><h3>Order cancelled</h3><p>${CANCELLED_DESC}</p><p style="margin-top:14px;"><a href="shop.html" style="color:var(--terra-light);font-weight:700;">Shop again</a></p></div>`
          : `<div class="track-map" id="trackMap"></div>
             <div class="track-timeline">${renderTimeline(order.status, order.paymentMethod)}</div>`}
        ${FINAL_STATUSES.has(order.status) ? '' : '<div class="track-autorefresh">Refreshing automatically every 30s</div>'}
        <div id="ratingSlot"></div>
      `;

      if (!isCancelled) updateDriverMap(order);

      if (order.status === 'DELIVERED') {
        stopPolling();
        await renderRating(order);
      } else if (isCancelled) {
        stopPolling();
      } else if (!pollTimer) {
        pollTimer = setInterval(() => { if (activeCode === code) fetchAndRender(code); }, 30000);
      }
    } catch (err) {
      console.error(err);
      result.innerHTML = '<div class="track-error">Something went wrong looking up your order. Check your connection and try again.</div>';
    }
  }

  async function renderRating(order) {
    const slot = document.getElementById('ratingSlot');
    if (!slot) return;

    if (order.rating != null) {
      slot.innerHTML = `
        <div class="rating-card">
          <div class="rating-label">You rated this delivery</div>
          <div class="rating-stars-display">${starIcons(order.rating)}</div>
          ${order.ratingComment ? `<div class="rating-comment-display">"${escapeHtml(order.ratingComment)}"</div>` : ''}
        </div>`;
      return;
    }

    const session = await getSession();
    if (!session) {
      slot.innerHTML = `
        <div class="rating-card">
          <div class="rating-label">How was your delivery?</div>
          <a href="login.html?redirect=${encodeURIComponent('track.html?code=' + order.code)}" style="color:var(--terra-light);font-size:12px;">Log in to rate this delivery</a>
        </div>`;
      return;
    }

    let selectedRating = 0;
    slot.innerHTML = `
      <div class="rating-card">
        <div class="rating-label">How was your delivery?</div>
        <div class="rating-stars" id="ratingStars"></div>
        <textarea id="ratingComment" placeholder="Anything else? (optional)" maxlength="500"></textarea>
        <button class="rating-submit" id="ratingSubmitBtn" disabled>Submit Rating</button>
      </div>`;
    document.getElementById('ratingSubmitBtn').onclick = () => submitRating(order.code);

    const starsEl = document.getElementById('ratingStars');
    const paintStars = () => {
      starsEl.innerHTML = starIcons(selectedRating, true);
      starsEl.querySelectorAll('.rating-star').forEach((btn, i) => {
        btn.setAttribute('aria-label', `${i + 1} star${i ? 's' : ''}`);
        btn.onclick = () => {
          selectedRating = i + 1;
          window._ekoyiniSelectedRating = selectedRating;
          paintStars();
          document.getElementById('ratingSubmitBtn').disabled = false;
        };
      });
    };
    paintStars();
  }

  function starIcons(count, interactive) {
    let html = '';
    for (let i = 1; i <= 5; i++) {
      const filled = i <= count;
      const svg = `<svg viewBox="0 0 24 24" fill="${filled ? 'var(--gold-deep)' : 'none'}" stroke="var(--gold-deep)" stroke-width="1.5" width="24" height="24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
      html += interactive
        ? `<button type="button" class="rating-star">${svg}</button>`
        : `<span class="rating-star-display">${svg}</span>`;
    }
    return html;
  }

  async function submitRating(code) {
    const rating = window._ekoyiniSelectedRating;
    if (!rating) return;
    const btn = document.getElementById('ratingSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';
    try {
      const res = await authedFetch(`/order/${encodeURIComponent(code)}/rate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rating, comment: document.getElementById('ratingComment').value }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || 'Failed to submit rating');
      }
      showToast('Thanks for your feedback!');
      lookup();
    } catch (err) {
      showToast(err.message || 'Failed to submit rating');
      btn.disabled = false;
      btn.textContent = 'Submit Rating';
    }
  }
  window.lookup = lookup;

  // Support ?code= from order-confirmation.html / profile.html links
  const params = new URLSearchParams(window.location.search);
  const prefillCode = params.get('code');
  if (prefillCode) {
    document.getElementById('codeInput').value = prefillCode;
    lookup();
  }
  </script>
</body>
</html>
