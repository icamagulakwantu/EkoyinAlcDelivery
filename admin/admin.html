<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekoyini Admin - Dispatch Dashboard</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- AUTH OVERLAY — full-screen, locks the dashboard until a real,
       allowlisted Supabase admin account signs in. -->
  <div id="authOverlay" class="auth-overlay">
    <div class="pin-screen" style="min-height:auto;background:none;padding:0;">
      <div class="pin-card" id="pinCard">
        <h2>Admin Access</h2>
        <p>Log in with your admin account</p>

        <form id="adminLoginForm" style="text-align:left;margin-top:16px;">
          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:12px;color:#888;margin-bottom:6px;">Email</label>
            <input type="email" id="adminEmail" required autocomplete="username"
              style="width:100%;background:#f5f5f5;border:1px solid #ddd;padding:12px;border-radius:8px;font-size:14px;">
          </div>
          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:12px;color:#888;margin-bottom:6px;">Password</label>
            <input type="password" id="adminPassword" required autocomplete="current-password"
              style="width:100%;background:#f5f5f5;border:1px solid #ddd;padding:12px;border-radius:8px;font-size:14px;">
          </div>
          <button type="submit" class="dispatch-btn" id="adminLoginBtn" style="width:100%;">Log In</button>
        </form>

        <p id="adminLoginError" style="color: #ff4444; font-size: 13px; display: none; margin-top: 14px;"></p>
        <p style="color:#999;font-size:11px;margin-top:16px;">
          Not an admin account yet? Sign up as a customer, then have an
          existing admin add your email to ADMIN_EMAILS.
        </p>
      </div>
    </div>
  </div>

  <!-- DASHBOARD (hidden behind authOverlay until PIN + OTP pass) -->
  <header class="admin-header">
    <h1>Ekoyini Dispatch</h1>
    <div class="header-stats">
      <div class="stat-box">
        <span class="stat-number" id="pendingCount">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat-box">
        <span class="stat-number" id="dispatchedCount">0</span>
        <span class="stat-label">Dispatched</span>
      </div>
      <div class="stat-box">
        <span class="stat-number" id="deliveredCount">0</span>
        <span class="stat-label">Delivered</span>
      </div>
    </div>
    <button class="secondary-btn" style="margin-top:12px;max-width:120px;" onclick="logout()">Log out</button>
  </header>

  <!-- SECTION NAV — Inventory/Admins only shown once /admin/me confirms role -->
  <div class="section-nav">
    <button class="section-tab active" id="sectionTabOrders" onclick="showSection('orders', this)">Orders</button>
    <button class="section-tab" id="sectionTabInventory" onclick="showSection('inventory', this)">Inventory</button>
    <button class="section-tab" id="sectionTabAdmins" onclick="showSection('admins', this)" style="display:none;">Admins</button>
    <button class="section-tab" id="sectionTabActivity" onclick="showSection('activity', this)" style="display:none;">Activity</button>
  </div>

  <!-- ORDERS SECTION -->
  <div id="ordersSection">
    <!-- FILTER TABS -->
    <div class="tabs">
      <button class="tab active" onclick="filterOrders('all', this)">All</button>
      <button class="tab" onclick="filterOrders('PAYMENT_PENDING', this)">Payment Pending</button>
      <button class="tab" onclick="filterOrders('PENDING', this)">Ready to Dispatch</button>
      <button class="tab" onclick="filterOrders('DISPATCHED', this)">Dispatched</button>
      <button class="tab" onclick="filterOrders('DELIVERED', this)">Delivered</button>
    </div>

    <!-- ORDERS LIST -->
    <div id="ordersList"></div>
  </div>

  <!-- INVENTORY SECTION -->
  <div id="inventorySection" style="display:none;">
    <div class="inv-search-row">
      <input type="text" id="invSearch" placeholder="Search products…" oninput="renderInventory()">
    </div>
    <div id="inventoryList"></div>
  </div>

  <!-- ADMINS SECTION (super-admin only) -->
  <div id="adminsSection" style="display:none;">
    <div class="admin-add-row">
      <input type="email" id="newAdminEmail" placeholder="Email to grant access">
      <select id="newAdminRole">
        <option value="DISPATCHER">Dispatcher</option>
        <option value="SUPER_ADMIN">Super Admin</option>
      </select>
      <button class="dispatch-btn" onclick="addAdmin()">Add</button>
    </div>
    <div id="adminsList"></div>
  </div>

  <!-- ACTIVITY SECTION (super-admin only) -->
  <div id="activitySection" style="display:none;">
    <div id="activityList"></div>
  </div>

  <!-- ASSIGN MODAL -->
  <div id="assignModal" class="modal" style="display:none;">
    <div class="modal-content assign-modal-content">
      <h2>Assign Order</h2>
      <p>Order Code: <strong id="assignOrderCode"></strong></p>

      <div class="assign-section">
        <h3>Select Tavern</h3>
        <select id="tavernSelect">
          <option value="">-- Choose Tavern --</option>
        </select>
      </div>

      <div class="assign-section">
        <h3>Driver Details</h3>
        <input type="text" id="driverName" placeholder="Driver name" />
        <input type="text" id="driverPhone" placeholder="Driver WhatsApp (278...)" />
        <input type="text" id="driverVehicle" placeholder="Vehicle (e.g., Uber, Bolt, I-Drive)" />
      </div>

      <div class="assign-actions">
        <button class="dispatch-btn" onclick="dispatchOrder()">Assign</button>
        <button class="secondary-btn" onclick="closeAssignModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth.js"></script>
  <script src="admin-api.js"></script>
</body>
</html>
