# render.yaml
# Deploy to Render with: git push origin main
# Render will auto-detect this file and configure everything.

services:
  - type: web
    name: ekoyini-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ekoyini-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: PORT
        value: "3000"
    autoDeploy: true

databases:
  - name: ekoyini-db
    plan: free
    ipAllowList: []
    postgresMajorVersion: 15