# render.yaml
# Deploy to Render with: git push origin main
# Render will auto-detect this file and configure everything.
#
# Database: Supabase only. Set DATABASE_URL in the Render dashboard to the
# Supabase *Session pooler* connection string (see DEPLOYMENT.md). This file
# no longer creates a Render Postgres database: the free one expires after
# about 30 days and was never the real store for orders.

services:
  - type: web
    name: ekoyini-api
    env: node
    # Free plan for now. It sleeps when idle, so the first request after a
    # quiet spell is slow and a Yoco webhook can time out. Move to "starter"
    # before enabling live card payments (LAUNCH_CHECKLIST item 1.4).
    plan: free
    # Database changes: scripts/migrate.js runs `prisma migrate deploy`,
    # which only applies the committed files in prisma/migrations/. It never
    # drops data, and a failure stops the deploy so the previous version keeps
    # running. (Replaces `prisma db push --accept-data-loss`.)
    # Then: shrink product photos and link verified local images. SKU label
    # corrections and retail repricing are deliberately kept out of deploys;
    # preview them with `npm run catalogue:dry-run` and run only after review.
    buildCommand: npm install && npx prisma generate && node scripts/migrate.js && node scripts/optimize-images.js && node prisma/sync-images.js
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PORT
        value: "3000"
    autoDeploy: true
